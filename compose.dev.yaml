services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: requestarr
      POSTGRES_USER: requestarr
      POSTGRES_PASSWORD: requestarr
    ports:
      - "${REQUESTARR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - requestarr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U requestarr -d requestarr" ]
      interval: 5s
      timeout: 3s
      retries: 20

  requestarr:
    build:
      context: .
    environment:
      REQUESTARR_ENV: development
      REQUESTARR_HTTP_ADDR: :8080
      REQUESTARR_PUBLIC_URL: ${REQUESTARR_PUBLIC_URL:-http://localhost:8080}
      REQUESTARR_DATABASE_URL: postgres://requestarr:requestarr@postgres:5432/requestarr?sslmode=disable
      REQUESTARR_OIDC_ISSUER: ${REQUESTARR_OIDC_ISSUER:?Set REQUESTARR_OIDC_ISSUER to an HTTPS issuer reachable by Requestarr}
      REQUESTARR_OIDC_CLIENT_ID: ${REQUESTARR_OIDC_CLIENT_ID:?Set REQUESTARR_OIDC_CLIENT_ID}
      REQUESTARR_OIDC_CLIENT_SECRET: ${REQUESTARR_OIDC_CLIENT_SECRET:?Set REQUESTARR_OIDC_CLIENT_SECRET}
      REQUESTARR_SESSION_HMAC_SECRET: ${REQUESTARR_SESSION_HMAC_SECRET:?Set REQUESTARR_SESSION_HMAC_SECRET to at least 32 random bytes}
      REQUESTARR_TMDB_READ_TOKEN: ${REQUESTARR_TMDB_READ_TOKEN:-}
      REQUESTARR_IGDB_CLIENT_ID: ${REQUESTARR_IGDB_CLIENT_ID:-}
      REQUESTARR_IGDB_CLIENT_SECRET: ${REQUESTARR_IGDB_CLIENT_SECRET:-}
      REQUESTARR_JELLYFIN_URL: ${REQUESTARR_JELLYFIN_URL:-}
      REQUESTARR_JELLYFIN_API_KEY: ${REQUESTARR_JELLYFIN_API_KEY:-}
      REQUESTARR_PLEX_URL: ${REQUESTARR_PLEX_URL:-}
      REQUESTARR_PLEX_TOKEN: ${REQUESTARR_PLEX_TOKEN:-}
      REQUESTARR_ROMM_URL: ${REQUESTARR_ROMM_URL:-}
      REQUESTARR_ROMM_TOKEN: ${REQUESTARR_ROMM_TOKEN:-}
      REQUESTARR_APPRISE_URL: ${REQUESTARR_APPRISE_URL:-}
      REQUESTARR_APPRISE_CONFIG_KEY: ${REQUESTARR_APPRISE_CONFIG_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./.devcontainer/keycloak/requestarr-realm.json:/opt/keycloak/data/import/requestarr-realm.json:ro

  apprise:
    image: caronc/apprise:latest
    ports:
      - "8000:8000"
    environment:
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: "1"
      APPRISE_ADMIN: "y"
    volumes:
      - requestarr-apprise:/config

volumes:
  requestarr-postgres:
  requestarr-apprise:
