openapi: 3.1.0
info:
  title: Requestarr API
  version: 0.0.0
  description: >-
    Every error response (4xx/5xx, including unknown paths and wrong methods) has the JSON body
    described by components/schemas/Error, and every response carries an X-Request-Id header
    (components/headers/RequestId). Per-operation error entries only list status meanings.
    A session of the local administrator who has not yet chosen their own password (mustChangePassword
    on /auth/me) gets 403 password_change_required from every route except /auth/me, /auth/logout and
    /auth/local/password (D040).
    Access levels: public, any signed-in session, administrator (admin or superuser), and
    superuser only. An operation marked x-required-role: superuser answers 403 forbidden with the
    message "the superuser role is required" to everyone else, an administrator included; an
    administrator route answers "the admin role is required" below that.
    Initial contract scaffold. Keep this synchronized with implemented handlers and
    generate clients/types only after endpoint semantics are reviewed.
servers:
  - url: /api/v1
paths:
  /admin/settings/authentication/local-administrator:
    get:
      x-required-role: superuser
      operationId: getLocalAdministratorStatus
      summary: Superuser-only recovery-account presence, disabled state and disable eligibility
      responses:
        '200':
          description: Local administrator status; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAdministratorStatus' }
        '401': { description: Authentication required }
        '403': { description: The superuser role is required }
    post:
      x-required-role: superuser
      operationId: createLocalAdministrator
      summary: Explicitly create the single recovery account on an upgraded instance
      description: Requires same-origin and session CSRF. Returns the generated password exactly once; the account must change it on first sign-in. Never resets an existing credential and never logs the password.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Created; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, password, mustChangePassword]
                properties:
                  username: { type: string, const: admin }
                  password: { type: string, description: One-time generated password; never returned by another operation }
                  mustChangePassword: { type: boolean, const: true }
        '401': { description: Authentication required }
        '403': { description: Administrator, Origin and CSRF required }
        '409': { description: Recovery account already exists }
        '500': { description: Creation or audit failed; no credential returned }
  /admin/settings/authentication/local-administrator/disabled:
    put:
      x-required-role: superuser
      operationId: setLocalAdministratorDisabled
      summary: Enable or disable the recovery account without changing its password
      description: Requires same-origin and session CSRF. Disabling requires another enabled administrator AND a working OIDC sign-in, and revokes all local sessions atomically with the audit event. A disabled account never satisfies last-admin protection.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        '200':
          description: Updated; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAdministratorStatus' }
        '400': { description: Invalid JSON }
        '401': { description: Authentication required }
        '403': { description: Administrator, Origin and CSRF required }
        '404': { description: Recovery account does not exist }
        '409': { description: "Cannot disable: no other enabled administrator (last_admin), or another admin exists but OIDC is off or not working so nobody could sign in (no_working_sign_in); checked server-side inside the serialised admin section" }
        '422': { description: disabled field required }
        '500': { description: Update or audit failed; previous state retained }
  /auth/options:
    get:
      operationId: getSignInOptions
      summary: Minimal unauthenticated sign-in options (no settings or credentials)
      responses:
        '200':
          description: Live sign-in options; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInOptions' }
  /admin/settings/authentication:
    get:
      x-required-role: superuser
      operationId: getAuthenticationSettings
      summary: Superuser-only OIDC state, source conflicts, saved metadata and redirect URI
      responses:
        '200':
          description: Local runtime state; no provider network request; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationSettings' }
        '401': { description: Authentication required }
        '403': { description: The superuser role is required }
    put:
      x-required-role: superuser
      operationId: saveAuthenticationSettings
      summary: Superuser-only atomic save and runtime apply
      description: >-
        Requires same-origin and session CSRF. A non-empty clientSecret replaces the encrypted secret;
        omitted or empty retains it. REQUESTARR_SECRETS_KEY is required for replacement. Enabled
        settings are discovered before persistence/publication, even if Test previously passed.
        Failure leaves both saved configuration and live provider unchanged. Concurrent writes serialize.
        In-flight sign-ins retain the provider and issuer they started with, for five minutes.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthenticationSettingsUpdate' }
      responses:
        '200':
          description: Saved and applied; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationSettings' }
        '400': { description: Invalid JSON or body exceeds 8192 bytes }
        '401': { description: Authentication required }
        '403': { description: Administrator, Origin and CSRF required }
        '409': { description: Environment override or missing master key }
        '422': { description: Invalid settings, unreadable secret or discovery failed }
        '500': { description: Persistence failed; previous configuration retained }
    delete:
      x-required-role: superuser
      operationId: discardAuthenticationSettings
      summary: Superuser-only discard of saved settings and encrypted secret
      description: Requires same-origin and session CSRF. Does not change an environment-controlled provider.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Saved configuration discarded; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationSettings' }
        '401': { description: Authentication required }
        '403': { description: Administrator, Origin and CSRF required }
        '500': { description: Persistence failed; previous configuration retained }
  /admin/settings/authentication/test:
    post:
      x-required-role: superuser
      operationId: testAuthenticationSettings
      summary: Superuser-only bounded OIDC discovery; does not save or publish
      description: Requires same-origin and session CSRF. Environment values are tested as a unit when present. Discovery checks metadata, not client credentials or a complete login.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthenticationSettingsUpdate' }
      responses:
        '200':
          description: Discovery passed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, warnings]
                properties:
                  ok: { type: boolean, const: true }
                  warnings: { type: array, items: { type: string }, description: 'Things discovery suggests will not work that do not stop OIDC being used, such as the groups scope being requested but not listed by the provider' }
        '400': { description: Invalid JSON or body exceeds 8192 bytes }
        '401': { description: Authentication required }
        '403': { description: Administrator, Origin and CSRF required }
        '422': { description: Invalid settings, unreadable secret or discovery failed }
  /admin/settings/authentication/enabled:
    put:
      x-required-role: superuser
      operationId: setAuthenticationEnabled
      summary: Superuser-only enable or disable without losing saved settings
      description: Requires same-origin and session CSRF. Enabling re-runs discovery before publishing. Environment-controlled settings are read-only. Turning OIDC off is refused with 409 oidc_is_only_sign_in while the local administrator is disabled.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Applied; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationSettings' }
        '400': { description: Invalid JSON or body exceeds 8192 bytes }
        '401': { description: Authentication required }
        '403': { description: Administrator, Origin and CSRF required }
        '409': { description: Environment-controlled configuration }
        '422': { description: No saved configuration or discovery failed }
        '500': { description: Persistence failed; previous configuration retained }
  /auth/login:
    get:
      operationId: startOIDCLogin
      responses:
        '302': { description: Redirect to configured identity provider }
        '503': { description: OIDC disabled, unavailable or pending transaction limit reached; local administrator sign-in remains available }
  /auth/callback:
    get:
      operationId: completeOIDCLogin
      responses:
        '303': { description: Set session and CSRF cookies, then redirect to canonical PublicURL }
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated user, synchronizer CSRF token and required password-change state.
          content:
            application/json:
              schema:
                type: object
                required: [user, csrfToken, mustChangePassword, localAdministrator, capabilities]
                properties:
                  user: { type: object, description: 'id, role (viewer, requester, admin or superuser), email and displayName' }
                  capabilities:
                    type: object
                    additionalProperties: false
                    required: [request, manageRequests, manageSystem, manageAccess]
                    description: What the role may do, derived on the server. The web app decides what to show from these and never compares role names.
                    properties:
                      request: { type: boolean, description: May create and extend requests }
                      manageRequests: { type: boolean, description: May approve, deny and cancel requests and handle issues }
                      manageSystem: { type: boolean, description: May use Settings and the administrative surface (admin and superuser) }
                      manageAccess: { type: boolean, description: 'May do what only the owner may: sign-in, credentials, connections, the Get started checklist, and giving or taking the admin and superuser roles (superuser only)' }
                  csrfToken: { type: string }
                  mustChangePassword:
                    type: boolean
                    description: True until the local administrator has chosen their own password; every other API route answers 403 password_change_required meanwhile.
                  localAdministrator:
                    type: boolean
                    description: True when this session is the built-in local administrator, the only account with a local password. The page offers Change password only then; POST /auth/local/password still answers 403 to everyone else.
        '401': { description: Authentication required }
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session revoked }
        '403': { description: Origin or CSRF validation failed }
  /auth/local/login:
    post:
      operationId: localLogin
      summary: Sign the built-in local administrator in with a password (D040)
      description: |
        Unauthenticated. The request must carry an Origin header equal to the public URL and a JSON content type, which a cross-site form cannot send.
        A wrong password, an unknown username and a disabled account all answer the same 401 after the same hashing work. The response to a FAILED
        attempt is held for an exponentially growing delay (1 second doubling to a 15 second cap, in memory) per account name and per client
        address; a correct password is never delayed or refused for that. Only a few verifications run at once (some capacity is reserved for
        clients that have not failed); a request that finds none free within a moment answers 429 with Retry-After without being checked.
        The client address is the TCP peer, or, when the peer is inside REQUESTARR_TRUSTED_PROXIES, the rightmost X-Forwarded-For entry outside it.
        Nothing locks the account. Every success and failure is audited.
        On success the session and CSRF cookies are set, as after an OIDC sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [user, mustChangePassword]
                properties:
                  user: { type: object }
                  mustChangePassword: { type: boolean }
        '400': { description: Body is not the expected JSON }
        '401': { description: Incorrect username or password (code invalid_credentials) }
        '403': { description: Origin missing or not the public URL }
        '415': { description: Content type is not application/json }
        '429': { description: Too many attempts at once; retry after Retry-After seconds (code too_many_attempts) }
        '503': { description: Local sign-in is unavailable }
  /auth/local/password:
    post:
      operationId: changeLocalPassword
      summary: The local administrator chooses a new password
      description: |
        Verifies the current password (a wrong one is throttled like a failed sign-in), requires 12 to 128 characters with no composition rules,
        refuses the current password, ends the account's other sessions and clears the must-change flag. Allowed while mustChangePassword is true.
        Only the account that has a local password may call it; anyone else is 403.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Password changed }
        '400': { description: invalid_password (length) or password_unchanged (same as current) }
        '401': { description: Authentication required }
        '403': { description: current_password_incorrect, forbidden (no local password), or Origin or CSRF validation failed }
        '429': { description: Too many attempts; wait Retry-After seconds }
  /notifications:
    get:
      operationId: listNotifications
      summary: List the authenticated user's notification inbox
      responses:
        '200':
          description: Up to 100 newest user-scoped inbox entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401': { description: Authentication required }
  /notifications/summary:
    get:
      operationId: notificationsSummary
      summary: How many inbox notifications the authenticated user has not read (their own only)
      responses:
        '200': { description: Count, content: { application/json: { schema: { type: object, required: [unread], properties: { unread: { type: integer, minimum: 0 } } } } } }
        '401': { description: Authentication required }
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Notification marked read }
        '401': { description: Authentication required }
        '403': { description: Origin or CSRF validation failed }
        '404': { description: Notification not found for current user }
  /version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: Build information
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, date]
                properties:
                  version: { type: string }
                  commit: { type: string }
                  date: { type: string }
  /catalog/{catalogID}/preview:
    get:
      operationId: moviePreviewState
      summary: Read local shared Request, subscription, and library availability state
      parameters:
        - { in: path, name: catalogID, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Local preview state and role-appropriate actions; no provider calls; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoviePreviewState' }
        '400': { description: Invalid catalog ID }
        '401': { description: Authentication required }
        '404': { description: Catalog item not found }
        '503': { description: Local preview state unavailable }
  /resolve:
    post:
      operationId: resolveUrl
      summary: Resolve a supported metadata URL without creating a request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 2048, description: "A TMDB, MusicBrainz, IGDB or Audible product URL, or a bare audiobook ASIN (resolved in the administrator's default Audible marketplace)" }
      responses:
        '200':
          description: Resolved canonical catalog item; movies and TV include typed details and local action state; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedPreview' }
        '400': { description: Unsupported URL, or the item was not found at the provider (metadata_resolution_failed) }
        '401': { description: Authentication required }
        '502': { description: The provider rejected Requestarr's credentials; an administrator must fix them (metadata_provider_credentials) }
        '503': { description: "The provider is busy (metadata_provider_busy, with Retry-After), its credentials are not set (metadata_provider_not_configured), or local preview state is unavailable; retry without discarding the pasted URL" }
  /search:
    get:
      operationId: searchByName
      summary: Find movies and TV (more types in later phases) by name, without creating anything
      description: >-
        Read-only front door to the resolver. Each result carries a ref that the
        resolver accepts, so picking a result means POST /resolve with that ref.
        Results are never stored, and request creation still accepts only a URL
        or catalog ID. Answers are cached in memory briefly and served stale
        only while the provider is busy or down. Viewers may search.
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 2, maxLength: 200 }, description: "Search text, trimmed; control characters are rejected" }
        - { in: query, name: type, required: true, schema: { type: string, enum: [movie_tv, album, song, game, audiobook] }, description: "Which provider to search. All five types are implemented. movie_tv (TMDB) and game (IGDB) are available only when their provider credentials were set at startup; otherwise they answer metadata_provider_not_configured. album and song use MusicBrainz (a song row is one recording: artist, length and first release in the subtitle), which allows about one request per second for the whole instance: it queues behind previews, holds at most a few waiting searches (more answer metadata_provider_busy at once) and stops when the client disconnects" }
        - { in: query, name: singles, schema: { type: boolean, default: false }, description: "album only: also include singles and EPs (otherwise primary type Album only). Ignored by other types" }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10, default: 1 } }
      responses:
        '200':
          description: One page of at most 50 results; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '400': { description: "invalid_search: text too short or long, control characters, unknown type, or page out of range" }
        '401': { description: Authentication required }
        '429':
          description: >-
            search_rate_limited: this user has used up the per-user search budget
            (a burst of 30, refilling four per second; fixed, not configurable).
            Retry-After gives whole seconds until the next search is accepted.
            Every well-formed search counts, including repeats answered from the
            cache; invalid (400) requests, GET /search/types and POST /resolve do not.
            Other users are not affected.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds to wait }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { description: The provider rejected Requestarr's credentials (metadata_provider_credentials) }
        '503': { description: "The provider is busy or unreachable (metadata_provider_busy, with Retry-After) or not set up (metadata_provider_not_configured); never an empty list" }
  /search/types:
    get:
      operationId: searchTypes
      summary: Which search types have a configured provider
      description: Session-level and non-secret, so every role can decide which types to offer. Reflects the running providers, so a TMDB token or IGDB credentials saved in Settings add or remove their types at once (D039).
      responses:
        '200':
          description: The configured types; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types: { type: array, items: { type: string, enum: [movie_tv, album, song, game, audiobook] } }
        '401': { description: Authentication required }
  /requests:
    get:
      operationId: listRequests
      summary: Search, filter, sort, and page the shared request queue
      description: >-
        Available to every authenticated role. Filters combine with AND. Title search
        is a case-insensitive literal substring, not a wildcard pattern. My Requests
        means the current user's subscriptions, not just requests they created.
        The first page freezes matching IDs and order for 15 minutes (at most 10000
        IDs); later pages return current request details without reapplying filters.
        New requests and changes to title, status, or subscriptions do not move rows
        between pages. Restart without a cursor to refresh membership/order.
        Cursors are opaque, scoped to the user and normalized query including limit,
        and survive process restarts. Each user retains five active snapshots;
        starting a sixth expires the oldest. No upstream service calls are made.
      parameters:
        - in: query
          name: requestId
          schema: { type: string, format: uuid }
          description: Exact shared Request ID for View request navigation; combines with other filters and participates in cursor identity.
        - in: query
          name: q
          description: Title substring; trimmed; at most 200 Unicode characters
          schema: { type: string, maxLength: 200 }
        - in: query
          name: status
          schema: { type: string, enum: [requested, approved, available, denied, cancelled] }
        - in: query
          name: mediaType
          schema: { type: string, enum: [movie, tv, album, song, game, audiobook] }
        - in: query
          name: mine
          schema: { type: boolean, default: false }
        - in: query
          name: sort
          description: >-
            Newest/oldest use request creation time; status uses requested, approved,
            available, denied, cancelled, then newest. Every order uses ID as a final
            ascending tie-breaker.
          schema: { type: string, enum: [newest, oldest, status], default: newest }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: cursor
          description: Opaque nextCursor from the previous page; repeat the same filters, sort, and limit
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Current request details in stable snapshot order; nextCursor is null on the final page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    description: Existing request objects, including availability, subscription state, and CatalogPlatforms. A request made by an administrator for the requester also carries madeOnBehalfBy (that administrator's user ID) and madeOnBehalfByName.
                    items: { type: object }
                  nextCursor: { type: [string, 'null'] }
        '400': { description: invalid_query for unknown, repeated, malformed, or out-of-range parameters; invalid_cursor for malformed, tampered, cross-user, or query-mismatched cursors }
        '401': { description: Authentication required }
        '410': { description: cursor_expired; snapshot expired, was evicted, or no longer exists; restart without cursor }
        '422': { description: query_too_large; more than 10000 matching requests; narrow the filters }
        '500': { description: requests_list_failed; safe generic error }
        '503': { description: requests_unavailable }
    post:
      operationId: createRequest
      summary: Create the one canonical shared request for an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platforms]
              properties:
                catalogId: { type: string, format: uuid }
                url: { type: string, maxLength: 2048, description: Supported TMDB, MusicBrainz, IGDB or Audible metadata URL, or a bare audiobook ASIN. Mutually exclusive with catalogId. }
                note: { type: string, maxLength: 2000 }
                onBehalfOf: { type: string, format: uuid, description: Make the request for this person (administrator or superuser only; any other role gets 403). The person becomes the requester with subscription source requester, is notified, and the approval policy applies as if they asked; the request records who acted. If the item already has a request the person is subscribed to it instead. The person must exist and be able to make requests (400 invalid_request otherwise). }
                platforms:
                  type: object
                  required: [any]
                  properties:
                    any: { type: boolean }
                    platformKeys: { type: array, items: { type: string } }
                selection: { $ref: '#/components/schemas/Selection' }
      responses:
        '201': { description: Canonical request created with creator subscription and event }
        '200': { description: Existing shared request returned. When it was open and the selection added to it, Merged is true, the selection was widened (never narrowed) and the caller now follows it. }
        '400': { description: Invalid request }
        '409': { description: already_available; a library already has the item and no Request exists, so none is created }
        '403': { description: 'The requester role or higher is required to create a request, and the admin role to make one on behalf of someone else; the message names the role' }
        '401': { description: Authentication required }
  /admin/sources/{source}/sync:
    post:
      operationId: syncSourceNow
      summary: Start a manual sync of a library Source (administrator only)
      description: >-
        Starts a sync in the background through the job runner and returns the new run.
        Manual and scheduled syncs share one no-overlap guard, so this returns 409 while a run
        is active instead of starting another. Follow progress with GET /admin/job-runs.
      parameters:
        - in: path
          name: source
          required: true
          description: Source slug, jellyfin, plex, romm or audiobookshelf (whichever are configured)
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Sync started
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: '#/components/schemas/JobRun' }
        '401': { description: Authentication required }
        '403': { description: Administrator role or CSRF validation failed }
        '404': { description: Source is not configured (code source_not_configured) }
        '409': { description: A sync for this source is already running (code sync_in_progress) }
        '503': { description: Sync unavailable }
  /admin/development-logs:
    get:
      operationId: getDevelopmentLogs
      summary: Recent connection-check diagnostics (development administrator only)
      description: >-
        Available only when REQUESTARR_DEV_LOGS is explicitly enabled and REQUESTARR_ENV is
        development; enabling it outside development is a startup configuration error. The route
        is not registered otherwise. Normal API authentication still applies to unknown routes.
        Returns a whole in-memory snapshot, oldest first, with at most 200 entries; refresh manually.
        Entries are lost on restart and seq is process-local. Only allowlisted connection-check
        facts are retained, never general logs, errors/messages, URLs, headers, query parameters,
        usernames, credentials, or provider bodies. A request-stage connected record means the HTTP
        and parse step succeeded; the final check record reports the target's validation outcome.
        IGDB uses separate oauth and platforms stages. No external calls are made to read this
        snapshot. All responses, including authorization errors and disabled-route misses, are no-store.
      responses:
        '200':
          description: Bounded recent snapshot
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entries, capacity]
                properties:
                  entries:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/DevelopmentLogEntry' }
                  capacity: { type: integer, const: 200 }
        '401': { description: Authentication required (including when disabled) }
        '403': { description: Administrator role required }
        '404': { description: Development logs disabled; authenticated request to absent route }
  /admin/status:
    get:
      operationId: getOperationalStatus
      summary: Provider and library Source status (administrator only)
      description: >-
        Local state only; never calls an external service. Every library Source kind is listed with
        whether it is configured, its latest run, last successful sync and last error (drawn from
        its 10 newest runs). Providers report configuration only. recentErrors lists up to 10 newest
        failed runs across Sources. Errors are fixed, admin-safe strings. Responses are no-store.
      responses:
        '200':
          description: Operational overview
          content:
            application/json:
              schema:
                type: object
                required: [providers, sources, recentErrors]
                properties:
                  developmentLogsEnabled:
                    type: boolean
                    const: true
                    description: Runtime capability for the development-logs endpoint; omitted when disabled. Administrator only.
                  providers:
                    type: array
                    items:
                      type: object
                      required: [key, name, configured]
                      properties:
                        key: { type: string }
                        name: { type: string }
                        configured: { type: boolean }
                        note: { type: string, description: "Fixed status text, for example 'stored secret unreadable' when a stored secret cannot be opened (D024); absent otherwise" }
                  sources:
                    type: array
                    items:
                      type: object
                      required: [slug, name, configured, lastRun, lastSuccessAt, lastSnapshotAt, lastError]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        configured: { type: boolean }
                        lastRun: { oneOf: [{ $ref: '#/components/schemas/JobRun' }, { type: 'null' }] }
                        lastSuccessAt: { type: [string, 'null'], format: date-time }
                        lastSnapshotAt: { type: [string, 'null'], format: date-time, description: When the Source last completed a full enumeration; a failed run never moves it }
                        lastError: { type: string }
                        note: { type: string, description: "Short fixed status such as 'stored secret unreadable'; absent when there is nothing to add" }
                  recentErrors:
                    type: array
                    items:
                      type: object
                      required: [source, run]
                      properties:
                        source: { type: string }
                        run: { $ref: '#/components/schemas/JobRun' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '500': { description: status_failed }
        '503': { description: status_unavailable }
  /admin/job-runs:
    get:
      operationId: listJobRuns
      summary: Recent background job runs per Source (administrator only)
      description: >-
        Lists up to 10 newest runs for every Source that has run a job. A Source never has two
        running runs; a run whose process crashed is failed with "abandoned: lease expired"
        once its lease lapses (lease times use the database clock). Each Source keeps its newest 200
        runs; older finished runs are pruned. Errors are fixed, admin-safe strings.
      responses:
        '200':
          description: Runs grouped by Source, newest first
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      required: [sourceId, name, runs]
                      properties:
                        sourceId: { type: string, format: uuid }
                        name: { type: string, description: Empty until the Source has been seen by a sync }
                        runs:
                          type: array
                          items: { $ref: '#/components/schemas/JobRun' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '503': { description: Job runs unavailable }
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users and their roles (administrator only)
      responses:
        '200':
          description: Users with id, email, displayName, role (viewer, requester, admin or superuser), builtin and createdAt; the local administrator is listed first with builtin true
          content:
            application/json:
              schema:
                type: object
                required: [users, rolesFromGroups]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
                  rolesFromGroups: { type: boolean, description: 'True while Assign roles from groups is on and OIDC is working, so a manual role change is overridden at the person''s next sign-in if their groups map to a role' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
  /admin/settings/people:
    get:
      operationId: getPeopleSettings
      summary: The role a person gets the first time they sign in (administrator only, D035)
      responses:
        '200':
          description: The current default; viewer unless an administrator changed it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeopleSettings' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
    put:
      operationId: setPeopleSettings
      summary: Choose the role new people get at first sign-in
      description: >-
        Applies only to people who sign in for the first time afterwards; existing users keep
        their role. Administrators are told in-app when someone signs in for the first time.
        The default can never be admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeopleSettings' }
      responses:
        '200':
          description: Saved; the body is the stored value, read back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeopleSettings' }
        '400': { description: "defaultRole is missing or not viewer or requester (code invalid_default_role); a malformed body or an unknown field (code invalid_json)" }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
  /admin/settings/approvals:
    get:
      operationId: getApprovalSettings
      summary: Media types whose Requests are approved automatically (administrator only, D036)
      responses:
        '200':
          description: The policy; an empty list unless an administrator chose types
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalSettings' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
    put:
      operationId: setApprovalSettings
      summary: Choose the media types whose new Requests start approved
      description: >-
        Applies only to Requests created afterwards; existing Requests are never changed.
        An auto-approved Request records a request.approved audit event marked auto with
        reason policy, and notifies its subscriber like a manual approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalSettings' }
        '400': { description: "autoApproveTypes is missing or names an unknown media type (code invalid_media_type); a malformed body or an unknown field (code invalid_json)" }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
  /admin/users/{userId}/role:
    put:
      operationId: changeUserRole
      summary: Set a user's role; revokes the target's active sessions and records an audit event
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [viewer, requester, admin, superuser] }
      responses:
        '204': { description: Role changed, or already set }
        '400': { description: Invalid user ID or role }
        '401': { description: Authentication required }
        '403': { description: "Role too low (code role_needed, the message names the role needed): a superuser may set anyone to any of the four roles; an admin may move a person only between requester and viewer and may not change an admin or a superuser; a requester or viewer may change nobody. CSRF failures also answer 403." }
        '404': { description: User not found }
        '409': { description: "Cannot change your own role (self_role_change), cannot demote the last superuser who can sign in (last_superuser; the local administrator counts only while enabled), or the target is the local administrator, whose role is fixed at superuser and is refused even for a superuser (builtin_admin_role); nothing is changed" }
  /library/recent:
    get:
      operationId: listRecentlyAddedToLibraries
      summary: Movies, series and albums the libraries gained most recently
      description: >-
        D029. Newest first by the library's own added date (first sighting when it gives none),
        from each source's latest complete snapshot, so a removed item never shows. Songs are
        left out. artworkUrl is present only when the owning library can supply a cover.
        Any signed-in role; private, cached for a minute.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
        - in: query
          name: types
          description: Comma-separated media types to include; default all five (movie, tv, album, game, audiobook). Home asks for movie,tv, for album and for game separately so each shelf has one cover shape.
          schema: { type: string, example: 'movie,tv' }
      responses:
        '200':
          description: Recently added items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, title, mediaType, source, addedAt]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        year: { type: integer }
                        mediaType: { type: string, enum: [movie, tv, album, game, audiobook] }
                        detail: { type: string, description: A short note from the library, such as a game's platform }
                        source: { type: string, description: The library's name }
                        addedAt: { type: string, format: date-time }
                        artworkUrl: { type: string }
        '401': { description: Authentication required }
        '500': { description: library_recent_failed }
  /issues:
    post:
      operationId: reportIssue
      summary: Report a problem with a Library item
      description: >-
        D030. Any signed-in role, Viewers included. The kinds offered depend on the item's media type
        (movie and series: video, audio, subtitles, wrong_item, other; album and song: audio, missing_tracks,
        wrong_tags, other; game: no_boot, wrong_region, wrong_version, missing_files, other). other needs a
        description. part (Selection) names a season, episode or track; movies and games have none. A report of
        the same item, kind and part as an open Issue joins it (200, joined true) instead of opening another (201).
        Limited to 10 new reports an hour per user (429). Requires CSRF and a same-origin Origin header.
      parameters:
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [libraryItemId, kind]
              properties:
                libraryItemId: { type: string, format: uuid }
                kind: { $ref: '#/components/schemas/IssueKind' }
                description: { type: string, maxLength: 2000 }
                part: { $ref: '#/components/schemas/Selection' }
      responses:
        '201': { description: A new Issue was opened, content: { application/json: { schema: { $ref: '#/components/schemas/IssueResult' } } } }
        '200': { description: Joined the open Issue for the same item, kind and part, content: { application/json: { schema: { $ref: '#/components/schemas/IssueResult' } } } }
        '400': { description: invalid_json }
        '401': { description: Authentication required }
        '404': { description: issue_not_found; no such library item }
        '422': { description: invalid_issue; the kind, description or part does not fit the item }
        '429': { description: rate_limited; Retry-After is sent }
    get:
      operationId: listIssues
      summary: Issues (administrators see all, everyone else the ones they reported)
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, in_progress, resolved, closed] } }
        - { in: query, name: kind, schema: { $ref: '#/components/schemas/IssueKind' } }
        - { in: query, name: mediaType, schema: { type: string, enum: [movie, tv, album, song, game, audiobook] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Issue' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { description: invalid_query or invalid_cursor }
        '401': { description: Authentication required }
  /issues/summary:
    get:
      operationId: issuesSummary
      summary: How many Issues still need an administrator, open or in progress (all for an administrator, otherwise the caller's)
      responses:
        '200': { description: Count, content: { application/json: { schema: { type: object, required: [open], properties: { open: { type: integer, minimum: 0 } } } } } }
        '401': { description: Authentication required }
  /issues/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getIssue
      summary: An Issue with its timeline
      description: An administrator sees every reporter and note; a reporter sees only their own. Anyone else gets 404.
      responses:
        '200':
          description: The Issue
          content:
            application/json:
              schema:
                type: object
                required: [issue, events, reporters, youReported]
                properties:
                  issue: { $ref: '#/components/schemas/Issue' }
                  events: { type: array, items: { type: object, required: [id, type, actorName, at], properties: { id: { type: string }, type: { type: string }, actorName: { type: string }, comment: { type: string }, at: { type: string, format: date-time } } } }
                  reporters: { type: array, items: { type: object, required: [userId, name, at, left], properties: { userId: { type: string }, name: { type: string }, note: { type: string }, at: { type: string, format: date-time }, left: { type: boolean } } } }
                  youReported: { type: boolean }
        '401': { description: Authentication required }
        '404': { description: issue_not_found }
  /issues/{id}/comments:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: commentOnIssue
      summary: Add a note (administrators on any Issue, others on Issues they reported)
      description: An administrator's comment tells the Issue's reporters in-app. Requires CSRF and a same-origin Origin header.
      parameters:
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [text], properties: { text: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        '204': { description: Added }
        '400': { description: invalid_json }
        '401': { description: Authentication required }
        '403': { description: Not a reporter of this Issue }
        '404': { description: issue_not_found }
        '422': { description: invalid_issue; empty or too long }
  /issues/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: setIssueStatus
      summary: Set an Issue's status: open, in progress, resolved or closed (administrator only)
      description: >-
        Any status other than the current one. Making an Issue active again (open or in progress) is refused (409) when another
        active Issue already holds the same item, kind and part. Reporters are notified in-app and the global Apprise route
        hears of it. Requires CSRF and a same-origin Origin header.
      parameters:
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, enum: [open, in_progress, resolved, closed] }, comment: { type: string, maxLength: 2000 } } }
      responses:
        '200': { description: The Issue as now, content: { application/json: { schema: { type: object, required: [issue], properties: { issue: { $ref: '#/components/schemas/Issue' } } } } } }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: issue_not_found }
        '409': { description: invalid_transition }
  /issues/{id}/reporter:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: leaveIssue
      summary: Stop hearing about an Issue you reported (it stays open)
      parameters:
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        '204': { description: Left, or already had }
        '401': { description: Authentication required }
        '404': { description: issue_not_found }
  /library/items:
    get:
      operationId: browseLibrary
      summary: Browse what the libraries hold, one media type at a time
      description: >-
        D030. The Library page's list: items in each enabled Source's latest complete snapshot, newest
        added first (the library's own added date, else first sighting). One title in two libraries of the
        same Source is one entry. Songs are not listed. Cursor pagination, 48 per page by default.
        Any signed-in role; private, cached for 30 seconds.
      parameters:
        - { in: query, name: type, required: true, schema: { type: string, enum: [movie, tv, album, game, audiobook] } }
        - { in: query, name: q, description: Case-insensitive title search (100 characters at most), schema: { type: string, maxLength: 100 } }
        - { in: query, name: source, description: A Source kind slug, schema: { type: string, enum: [jellyfin, plex, romm, navidrome, audiobookshelf] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 48 } }
        - { in: query, name: cursor, description: The nextCursor of the previous page, schema: { type: string } }
      responses:
        '200':
          description: One page of Library items
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LibraryItem' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { description: invalid_query or invalid_cursor }
        '401': { description: Authentication required }
        '500': { description: library_browse_failed }
  /library/items/{id}:
    get:
      operationId: getLibraryItem
      summary: One Library item, with how many open Issues it has
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '401': { description: Authentication required }
        '404': { description: library_item_not_found }
        '500': { description: library_browse_failed }
  /library/items/{id}/artwork:
    get:
      operationId: getLibraryItemArtwork
      summary: A library item's cover, fetched by the library's own adapter
      description: >-
        The library's credentials stay in the server. The reference is validated to one item's
        cover path before any request is made; the response is an image (jpeg, png or webp) with
        nosniff, private and cached for a day. Library errors are never echoed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The cover image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { description: Authentication required }
        '404': { description: artwork_not_found }
        '502': { description: artwork_unavailable }
  /admin/library-connections:
    get:
      x-required-role: superuser
      operationId: listLibraryConnections
      summary: Where each library Source lives, with its credential status (superuser only)
      description: >-
        D028. Lists Jellyfin, Plex, RomM, Navidrome and Audiobookshelf with their saved address, whether the
        address comes from an environment variable (which wins and cannot be changed here),
        whether the Source is scheduled to sync, what a half-set Source is missing, and the
        status of each credential. Credential values are never returned. No-store.
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/LibraryConnection' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '500': { description: connection_update_failed }
  /admin/library-connections/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string, enum: [jellyfin, plex, romm, navidrome, audiobookshelf] }
    put:
      x-required-role: superuser
      operationId: saveLibraryConnection
      summary: Save a Source's address, username and credential in one request and apply it (superuser only)
      description: >-
        Stores the address (and username) and any credentials in one database transaction, then
        rebuilds the Source's sync once from the environment, the saved address and the stored
        credentials without a restart. Either everything is saved or nothing is. The old
        address-only request still works. Omit url to leave the address as it is, which is how a
        credential is saved for an address set by an environment variable (sending url then is
        409 set_by_environment). A credential not named in credentials keeps its saved value. Credential
        values are write-only and are never returned or logged. A Source with an address but no
        credential stays inactive and reports what is missing. Errors name the part that failed
        and nothing is changed: 422 invalid_connection (address), 422 invalid_secret_value or
        invalid_credential (credential), 409 secrets_disabled (no master key). Requires CSRF and
        a same-origin Origin header.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryConnectionSave' }
      responses:
        '200':
          description: The saved connection as now applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryConnection' }
        '400': { description: invalid_connection_input }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: unknown_source }
        '409': { description: set_by_environment or secrets_disabled }
        '422': { description: invalid_connection, invalid_secret_value or invalid_credential }
    delete:
      x-required-role: superuser
      operationId: removeLibraryConnection
      summary: Remove a saved address and stop the Source's sync (superuser only)
      description: >-
        Deletes the saved address; the Source stops syncing unless an environment address
        remains. Inventory already observed is kept. Requires CSRF and a same-origin Origin header.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The connection as now applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryConnection' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: unknown_source }
  /admin/library-connections/{slug}/test:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string, enum: [jellyfin, plex, romm, navidrome, audiobookshelf] }
    post:
      x-required-role: superuser
      operationId: testLibraryConnection
      summary: Probe a Source with its current address and credentials (superuser only)
      description: >-
        An explicit check of this exact Source: one short read-only request, the same probe the
        library checks use. The message never contains a credential. Requires CSRF and a
        same-origin Origin header.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Result of the probe
          content:
            application/json:
              schema:
                type: object
                required: [ok, code, message]
                properties:
                  ok: { type: boolean }
                  code: { type: string, enum: [connected, connection_failed, authentication_failed, environment_required, incomplete_settings, disabled] }
                  message: { type: string }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: unknown_source }
  /admin/secrets:
    get:
      x-required-role: superuser
      operationId: listStoredSecrets
      summary: Stored integration secrets, write-only status (superuser only)
      description: >-
        D024. Lists each registered secret with whether it is configured, where its effective
        value comes from, and whether a change waits for a restart. The TMDB token, IGDB client secret and Apprise key, like library credentials, apply when saved and so never wait. Values and ciphertext are
        never returned. enabled is false when REQUESTARR_SECRETS_KEY is not set, in which case
        the UI must refuse secret values. Responses are no-store.
      responses:
        '200':
          description: Secret status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, secrets]
                properties:
                  enabled: { type: boolean, description: "A valid master key is configured, so values can be saved" }
                  secrets:
                    type: array
                    items: { $ref: '#/components/schemas/SecretStatus' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '500': { description: "secret_status_failed" }
  /admin/secrets/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string, enum: [tmdb_read_token, igdb_client_secret, apprise_config_key, navidrome_password, jellyfin_api_key, plex_token, romm_token, audiobookshelf_api_key] }
    put:
      x-required-role: superuser
      operationId: setStoredSecret
      summary: Save or replace a stored secret (superuser only)
      description: >-
        Encrypts the value with the master key (AES-256-GCM) and stores it with the key id.
        Available before and after setup Finish. The value is never returned, logged, audited or
        echoed in errors; a value-free audit event is written in the same transaction. The new
        value applies at once for the TMDB token, IGDB client secret, Apprise key and library credentials (D028, D039); an environment value still wins. If the running providers cannot be rebuilt the value stays saved, the previous configuration stays in use and the response is 500 settings_not_applied. Requires CSRF and a
        same-origin Origin header. Body is capped at 8 KiB.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: "No surrounding whitespace or control characters" }
      responses:
        '204': { description: Secret saved }
        '400': { description: "invalid_secret_input; malformed, unknown-field or oversized body" }
        '401': { description: Authentication required }
        '403': { description: "Administrator role or CSRF/Origin failure" }
        '404': { description: "unknown_secret" }
        '409': { description: "secrets_disabled; REQUESTARR_SECRETS_KEY is not configured" }
        '422': { description: "invalid_secret_value" }
        '500': { description: "secret_update_failed (safe generic message), or settings_not_applied (saved, but the previous configuration is still in use)" }
    delete:
      x-required-role: superuser
      operationId: clearStoredSecret
      summary: Clear a stored secret (superuser only)
      description: >-
        Deletes the stored value (also when the master key is missing or wrong). Records a
        value-free audit event in the same transaction. Clearing an absent secret is a no-op.
        Requires CSRF and a same-origin Origin header.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Secret cleared }
        '401': { description: Authentication required }
        '403': { description: "Administrator role or CSRF/Origin failure" }
        '404': { description: "unknown_secret" }
        '500': { description: "secret_update_failed (safe generic message), or settings_not_applied (cleared, but the previous configuration is still in use)" }
  /admin/checklist:
    get:
      x-required-role: superuser
      operationId: getChecklist
      summary: The Get started checklist, computed from live state (superuser only, D038)
      description: >-
        Takes no input. Each item is derived from what the instance is configured with:
        a library connected and synced, a metadata provider (TMDB or IGDB; MusicBrainz
        is always on and does not count), notifications and the default role for new people.
        `visible` is false once every required item is done or an administrator dismissed it.
        Responses use Cache-Control no-store.
      responses:
        '200':
          description: The items and whether to keep offering the checklist
          content:
            application/json:
              schema:
                type: object
                required: [items, dismissed, visible]
                properties:
                  dismissed: { type: boolean, description: "An administrator dismissed the checklist; remembered for the instance" }
                  visible: { type: boolean, description: "Not dismissed and at least one required item is open" }
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, title, required, done]
                      properties:
                        key: { type: string, enum: [libraries, metadata, notifications, oidc, people] }
                        title: { type: string }
                        required: { type: boolean }
                        done: { type: boolean }
                        detail: { type: string, description: "What is missing or what to do next; absent when done" }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '500': { description: "checklist_failed" }
  /admin/checklist/dismiss:
    post:
      x-required-role: superuser
      operationId: dismissChecklist
      summary: Dismiss the Get started checklist for the whole instance (superuser only)
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Dismissed; repeating the request is harmless }
        '401': { description: Authentication required }
        '403': { description: "Administrator role or CSRF/Origin failure" }
        '500': { description: "checklist_failed" }
  /admin/settings/igdb:
    get:
      x-required-role: superuser
      operationId: getIgdbSettings
      summary: The non-secret IGDB client ID (superuser only)
      description: >-
        Responses use Cache-Control no-store. The client secret is a stored secret
        (see /admin/secrets/{name}); only the client ID is a plain setting.
      responses:
        '200':
          description: The effective client ID and whether an environment value supplies it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IgdbSettings' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '500': { description: "igdb_settings_failed" }
    put:
      x-required-role: superuser
      operationId: setIgdbSettings
      summary: Save the IGDB client ID (superuser only)
      description: >-
        Applies at once, like the TMDB token and IGDB secret (D039). An empty value clears it.
        An installation upgraded from the retired setup draft keeps the client ID it saved
        there until one is saved here.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId]
              properties:
                clientId: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IgdbSettings' }
        '400': { description: "invalid_client_id; clientId missing, has control characters or is over 256 characters. invalid_json; a malformed body or an unknown field" }
        '401': { description: Authentication required }
        '403': { description: "Administrator role or CSRF/Origin failure" }
        '409': { description: "managed_by_environment; REQUESTARR_IGDB_CLIENT_ID wins and cannot be changed here" }
        '500': { description: "igdb_settings_failed, or settings_not_applied (saved, but the previous configuration is still in use)" }
  /admin/match-suggestions:
    get:
      operationId: listMatchSuggestions
      summary: List current title/year candidates for administrator review
      description: >-
        Returns up to 100 pending candidates, oldest first, from the latest successful
        complete source snapshots. Failed syncs preserve the last-known view.
        Suggestions never establish availability. Exact identifier matches take precedence.
      responses:
        '200':
          description: Pending candidates, including confidence and reason; an empty list is items=[]
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/MatchSuggestion' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '500': { description: Could not load suggestions }
        '503': { description: Match review unavailable }
  /admin/match-suggestions/{suggestionId}/accept:
    post:
      operationId: acceptMatchSuggestion
      summary: Confirm a library match and reconcile availability (administrator only)
      description: >-
        Records the review actor, adds ordinary source/platform evidence, and invokes
        the normal availability/event/notification path in one transaction. Repeating
        an accepted decision succeeds without duplicate effects. A dismissed decision
        cannot be reversed. Stale candidates cannot be accepted. No request body.
      parameters:
        - in: path
          name: suggestionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Match accepted, or the same decision was already recorded }
        '400': { description: Invalid suggestion ID }
        '401': { description: Authentication required }
        '403': { description: Administrator role required, or CSRF/origin validation failed }
        '404': { description: Suggestion not found }
        '409': { description: Suggestion dismissed already, or no longer current; refresh after a successful sync }
        '500': { description: Review failed; transaction rolled back }
        '503': { description: Match review unavailable }
  /admin/match-suggestions/{suggestionId}/dismiss:
    post:
      operationId: dismissMatchSuggestion
      summary: Permanently dismiss a candidate without changing availability (administrator only)
      description: >-
        Records an auditable terminal decision for this catalog/library-item pair.
        Later syncs do not reopen it. Repeating the dismissal is a successful no-op.
        An accepted decision cannot be reversed. No request body.
      parameters:
        - in: path
          name: suggestionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Dismissed, or dismissal already recorded; availability unchanged }
        '400': { description: Invalid suggestion ID }
        '401': { description: Authentication required }
        '403': { description: Administrator role required, or CSRF/origin validation failed }
        '404': { description: Suggestion not found }
        '409': { description: Suggestion already accepted }
        '500': { description: Review failed; transaction rolled back }
        '503': { description: Match review unavailable }
  /requests/summary:
    get:
      operationId: requestsSummary
      summary: How many Requests still wait for approval (administrator only, D036)
      responses:
        '200': { description: Count of Requests with status requested, content: { application/json: { schema: { type: object, required: [requested], properties: { requested: { type: integer, minimum: 0 } } } } } }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
  /requests/{requestId}/subscription:
    put:
      operationId: subscribeToRequest
      summary: Enable Notify Me for the current user
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Subscription enabled; changed=false when already enabled }
        '400': { description: Invalid request ID }
        '409': { description: Request is closed (denied, available or cancelled) and takes no new subscribers }
        '404': { description: Request not found }
        '401': { description: Authentication required }
    delete:
      operationId: unsubscribeFromRequest
      summary: Leave a request (D016); the last subscriber leaving cancels an open request
      description: >-
        Removes the current user's subscription. Any subscriber may leave, including the
        creator. The request stays open while other subscribers remain; when the last
        subscriber of a requested or approved request leaves, it becomes cancelled with a
        version bump and an audit event, but only with confirmCancel=true; without it the
        server returns 409 would_cancel and changes nothing. Idempotent by state, with no
        operation key: leaving again returns changed=false and writes no event.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: confirmCancel
          required: false
          description: Must be true for a leave that would cancel the request (the caller is the last subscriber)
          schema: { type: boolean, default: false }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Left (or was not subscribed)
          content:
            application/json:
              schema:
                type: object
                required: [subscribed, changed, cancelled]
                properties:
                  subscribed: { type: boolean, description: Always false after a leave }
                  changed: { type: boolean }
                  cancelled: { type: boolean, description: True when this leave cancelled the request }
        '400': { description: Invalid request ID }
        '401': { description: Authentication required }
        '409': { description: Leaving would cancel the request and confirmCancel was not set (code would_cancel) }
        '404': { description: Request not found }
  /requests/{requestId}/transition:
    post:
      operationId: transitionRequest
      summary: Admin-only approval or denial of a requested item, or outright cancellation of an open one; does not alter availability
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toStatus, expectedVersion, operationId]
              properties:
                toStatus: { type: string, enum: [approved, denied, cancelled], description: approved and denied apply to requested requests; cancelled applies to requested or approved requests }
                expectedVersion: { type: integer, minimum: 1 }
                operationId: { type: string, format: uuid }
      responses:
        '200': { description: Transition committed with incremented request version and audit event }
        '400': { description: Invalid transition payload or lifecycle transition not allowed from the current status }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: Request not found }
        '409': { description: Stale request version }
components:
  headers:
    RequestId:
      description: >-
        Unique ID assigned to every response; also logged by the server as
        request_id. Client-supplied values are ignored. Quote it when reporting problems.
      schema: { type: string }
  schemas:
    LocalAdministratorStatus:
      type: object
      additionalProperties: false
      required: [exists, disabled, canDisable, otherAdminExists, oidcWorking]
      properties:
        exists: { type: boolean }
        disabled: { type: boolean }
        canDisable:
          type: boolean
          description: True only while another admin exists and OIDC is enabled with a working provider, so someone can really sign in once the account is off.
        otherAdminExists: { type: boolean }
        oidcWorking: { type: boolean, description: From the live OIDC state, not a network probe }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role, builtin, canRequest, roleFromGroups, createdAt, roleChoices]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [viewer, requester, admin, superuser] }
        builtin: { type: boolean, description: True only for the local administrator, whose role is locked to superuser }
        canRequest: { type: boolean, description: Whether a request can be made for this person (the request modal person picker offers only these) }
        roleFromGroups: { type: boolean, description: 'True when the last change to this person''s role was made by their groups at sign-in (audit source group_mapping); a later manual change clears it. No group names are ever returned' }
        createdAt: { type: string, format: date-time }
        roleChoices:
          type: array
          description: The roles the signed-in role may give this person, weakest first. Empty for the signed-in person, the local administrator, and anyone the signed-in role may not change (an admin cannot change an admin or a superuser). The page offers exactly these.
          items: { type: string, enum: [viewer, requester, admin, superuser] }
    SignInOptions:
      type: object
      additionalProperties: false
      required: [oidcEnabled, providerName]
      properties:
        oidcEnabled: { type: boolean }
        providerName: { type: string, maxLength: 100 }
    OIDCSettings:
      type: object
      additionalProperties: false
      required: [enabled, providerName, issuer, clientId, scopes, assignRolesFromGroups, groupsClaim, ownerGroup, adminGroup, userGroup, viewerGroup]
      properties:
        enabled: { type: boolean }
        providerName: { type: string, maxLength: 100 }
        issuer: { type: string, maxLength: 2048 }
        clientId: { type: string, maxLength: 512 }
        scopes: { type: string, maxLength: 1024, description: 'Space-separated OIDC scopes requested at sign-in; openid is always first. A new setup defaults to "openid profile email groups"; a configuration saved before this setting, and an environment configuration, request "openid profile email"' }
        assignRolesFromGroups: { type: boolean, description: 'Let the groups in the ID token decide the person''s role at every sign-in. Off by default and for configurations saved before this setting, because turning it on can change roles' }
        groupsClaim: { type: string, maxLength: 200, description: 'ID-token claim that holds the groups (a list of text values or one text value). Blank saves as groups' }
        ownerGroup: { type: string, maxLength: 200, description: 'Group that makes a person a superuser. Blank saves as owner' }
        adminGroup: { type: string, maxLength: 200, description: 'Group that makes a person an admin. Blank saves as admin' }
        userGroup: { type: string, maxLength: 200, description: 'Group that makes a person a requester. Blank saves as user' }
        viewerGroup: { type: string, maxLength: 200, description: 'Group that makes a person a viewer. Blank saves as viewer. The most powerful matching group wins; matching ignores letter case and one leading slash' }
    AuthenticationSettingsUpdate:
      type: object
      additionalProperties: false
      required: [enabled, providerName, issuer, clientId, scopes]
      properties:
        enabled: { type: boolean }
        providerName: { type: string, minLength: 1, maxLength: 100 }
        issuer: { type: string, format: uri, maxLength: 2048 }
        clientId: { type: string, minLength: 1, maxLength: 512 }
        scopes: { type: string, maxLength: 1024, description: 'Space-separated scope tokens (printable ASCII, no quotes or backslashes). Normalised on save: duplicates removed, openid always first, so an empty value saves as "openid"' }
        assignRolesFromGroups: { type: boolean, description: 'Let the groups in the ID token decide the person''s role at every sign-in. Off by default and for configurations saved before this setting, because turning it on can change roles' }
        groupsClaim: { type: string, maxLength: 200, description: 'ID-token claim that holds the groups (a list of text values or one text value). Blank saves as groups' }
        ownerGroup: { type: string, maxLength: 200, description: 'Group that makes a person a superuser. Blank saves as owner' }
        adminGroup: { type: string, maxLength: 200, description: 'Group that makes a person an admin. Blank saves as admin' }
        userGroup: { type: string, maxLength: 200, description: 'Group that makes a person a requester. Blank saves as user' }
        viewerGroup: { type: string, maxLength: 200, description: 'Group that makes a person a viewer. Blank saves as viewer. The most powerful matching group wins; matching ignores letter case and one leading slash' }
        clientSecret: { type: string, maxLength: 4096, writeOnly: true, description: Empty or omitted retains the saved secret; never returned }
    AuthenticationSettings:
      type: object
      additionalProperties: false
      required: [state, missing, ignored, differing, saved, effective, secretConfigured, secretUnreadable, canSaveSecret, readOnly, redirectUri, working, problem]
      properties:
        state: { type: string, enum: [not_configured, saved_only, environment_only, environment_overriding_saved, environment_incomplete] }
        missing: { type: array, items: { type: string }, description: Missing environment variable names, never values }
        ignored: { type: array, items: { type: string }, description: Saved fields ignored by the environment unit }
        differing: { type: array, items: { type: string }, description: Variable names whose saved values differ; never secret values }
        saved:
          oneOf:
            - { $ref: '#/components/schemas/OIDCSettings' }
            - { type: 'null' }
        effective: { $ref: '#/components/schemas/OIDCSettings' }
        secretConfigured: { type: boolean }
        secretUnreadable: { type: boolean }
        canSaveSecret: { type: boolean }
        readOnly: { type: boolean }
        redirectUri: { type: string, format: uri }
        working: { type: boolean, description: A discovered provider snapshot is active; not a live health request }
        problem: { type: string, description: Value-free startup failure summary }
    SearchResult:
      type: object
      required: [mediaType, provider, providerId, ref, title]
      description: A pointer to a provider item, not a catalog item. Nothing here is stored.
      properties:
        mediaType: { type: string, enum: [movie, tv, album, song, game, audiobook] }
        provider: { type: string }
        providerId: { type: string }
        ref: { type: string, description: "A value the same provider's resolver accepts (for TMDB, https://www.themoviedb.org/movie/<id> or /tv/<id>)" }
        title: { type: string }
        year: { type: integer, description: Omitted when unknown }
        subtitle: { type: string }
        artworkUrl: { type: string }
        artworkKind: { type: string }
        local:
          $ref: '#/components/schemas/SearchLocal'
    SearchLocal:
      type: object
      required: [availability]
      description: >-
        What this instance already knows about the item, from the local database only
        (no provider or library call). Omitted from a result never resolved here; omission
        means "never resolved here", not "missing". For album and song results a library that
        files music under a MusicBrainz release or release-track id (Plex) is matched through the
        item's aliases (D020), which exist only once the item has been opened or requested: until
        then such a library item is unknown here and the result carries no "In library" claim.
        Advisory: Request writes enforce everything again.
      properties:
        catalogId: { type: string, format: uuid, description: Present when a catalog item exists }
        requestStatus: { type: string, enum: [requested, approved, denied, available, cancelled], description: Present when the item has a Request }
        availability:
          type: string
          enum: [unknown, available, missing]
          description: '"available" only when an enabled library source''s latest complete snapshot holds the item'
    SearchPage:
      type: object
      required: [results, hasMore]
      properties:
        results: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/SearchResult' } }
        hasMore: { type: boolean, description: There is a further page. No total count is given. }
    ResolvedPreview:
      type: object
      required: [Item, Platforms]
      properties:
        Item:
          type: object
          description: Canonical catalog item; existing PascalCase fields are preserved.
          properties:
            ID: { type: string, format: uuid }
            MediaType: { type: string, enum: [movie, tv, album, song, game, audiobook] }
            Title: { type: string }
            Year: { type: integer }
            Provider: { type: string }
            ProviderID: { type: string }
            ArtworkURL: { type: string }
            ArtworkKind: { type: string, enum: [poster, square] }
            ExternalURL: { type: string }
        Platforms: { type: array, items: { type: object } }
        Movie: { $ref: '#/components/schemas/MovieDetails' }
        TV: { $ref: '#/components/schemas/TVDetails' }
        Game: { $ref: '#/components/schemas/GameDetails' }
        Music: { $ref: '#/components/schemas/MusicDetails' }
        Preview: { $ref: '#/components/schemas/MoviePreviewState' }
    MusicDetails:
      type: object
      additionalProperties: false
      description: MusicBrainz details of an album or song, shown on the request preview. Every field is optional. Album art comes from the Cover Art Archive.
      properties:
        artists: { type: array, maxItems: 10, items: { type: string, maxLength: 256 } }
        primaryType: { type: string, maxLength: 40, description: "For an album, such as Album, EP or Single" }
        secondaryTypes: { type: array, maxItems: 5, items: { type: string, maxLength: 40 } }
        releaseDate: { type: string, format: date, description: Present only when MusicBrainz has a complete date }
        genres: { type: array, maxItems: 10, items: { type: string, maxLength: 80 } }
        lengthSeconds: { type: integer, minimum: 1, description: A song's duration }
        appearsOn: { type: array, maxItems: 5, items: { type: string, maxLength: 256 }, description: Releases a song appears on }
        tracks:
          type: array
          maxItems: 200
          description: An album's tracklist from one release, for choosing tracks to request. Absent when MusicBrainz could not supply it.
          items:
            type: object
            additionalProperties: false
            required: [id, position, title]
            properties:
              id: { type: string, maxLength: 64 }
              position: { type: integer, minimum: 1, description: Counts across discs }
              title: { type: string, maxLength: 512 }
              lengthSeconds: { type: integer, minimum: 1 }
        score: { type: number, minimum: 0, maximum: 5, description: MusicBrainz community rating on a 0-5 scale }
        ratingCount: { type: integer, minimum: 1 }
    GameDetails:
      type: object
      additionalProperties: false
      description: IGDB details of a game, shown on the request preview. Every field is optional.
      properties:
        overview: { type: string, maxLength: 10000 }
        genres: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        releaseDate: { type: string, format: date }
        developers: { type: array, maxItems: 10, items: { type: string, maxLength: 256 } }
        score: { type: number, minimum: 0, maximum: 100, description: IGDB rating on a 0-100 scale }
        ratingCount: { type: integer, minimum: 1 }
        backdropUrl: { type: string, description: An IGDB screenshot }
    MovieDetails:
      type: object
      additionalProperties: false
      description: Movie-only validated metadata persisted in the existing catalog JSON; omitted facts are unknown. Credits have a 1.5-second sub-budget within a nine-second total lookup.
      properties:
        overview: { type: string, maxLength: 10000 }
        runtime: { type: integer, minimum: 1, maximum: 1440 }
        genres: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        releaseDate: { type: string, format: date }
        releaseStatus: { type: string, enum: [Rumored, Planned, In Production, Post Production, Released, Canceled] }
        score: { type: number, minimum: 0, maximum: 10, description: Present only with a positive ratingCount; not Requestarr votes }
        ratingCount: { type: integer, minimum: 1, maximum: 1000000000 }
        backdropUrl: { type: string, format: uri, description: Approved TMDB image origin only }
        directors: { type: array, maxItems: 10, items: { type: string, maxLength: 256 } }
        cast:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, maxLength: 256 }
              character: { type: string, maxLength: 256 }
              profileUrl: { type: string, format: uri, description: Approved TMDB image origin only }
        detailsUnavailable: { type: boolean, description: Secondary enrichment failed; ordinary absent credits are not a failure }
    IssueKind:
      type: string
      enum: [video, audio, subtitles, wrong_item, missing_tracks, wrong_tags, no_boot, wrong_region, wrong_version, missing_files, other]
    Issue:
      type: object
      additionalProperties: false
      required: [id, libraryItemId, title, mediaType, source, kind, kindLabel, part, status, reporters, goneFromLibrary, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        libraryItemId: { type: string, format: uuid }
        title: { type: string }
        mediaType: { type: string, enum: [movie, tv, album, song, game, audiobook] }
        source: { type: string }
        kind: { $ref: '#/components/schemas/IssueKind' }
        kindLabel: { type: string }
        part: { $ref: '#/components/schemas/Selection' }
        status: { type: string, enum: [open, in_progress, resolved, closed] }
        description: { type: string, description: The first reporter's note }
        artworkUrl: { type: string, description: The item's cover from its library }
        link: { type: string, format: uri, description: Opens the item in its media server }
        year: { type: integer }
        sourceKind: { type: string, enum: [jellyfin, plex, romm, navidrome, audiobookshelf] }
        reporters: { type: integer, minimum: 0, description: Reporters still following the Issue }
        goneFromLibrary: { type: boolean, description: Its Source has since synced without the item }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    IssueResult:
      type: object
      required: [issue, joined]
      properties:
        issue: { $ref: '#/components/schemas/Issue' }
        joined: { type: boolean }
    LibraryItem:
      type: object
      additionalProperties: false
      required: [id, title, mediaType, source, sourceKind, addedAt, openIssues, issueKinds]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        year: { type: integer }
        mediaType: { type: string, enum: [movie, tv, album, game, audiobook] }
        source: { type: string, description: The library's name }
        sourceKind: { type: string, enum: [jellyfin, plex, romm, navidrome, audiobookshelf] }
        addedAt: { type: string, format: date-time }
        detail: { type: string, description: A short note from the library, such as a game's platform }
        artworkUrl: { type: string }
        link: { type: string, format: uri, description: Opens the item in its media server; present only when safe }
        openIssues: { type: integer, minimum: 0 }
        details:
          type: object
          additionalProperties: false
          description: What the library says about the item (single-item reads only); every field is optional
          properties:
            synopsis: { type: string }
            rating: { type: number, minimum: 0, maximum: 10, description: The library's audience or community rating out of 10 }
            contentRating: { type: string, description: A certification such as PG-13 }
            genres: { type: array, items: { type: string } }
            runtimeMinutes: { type: integer, minimum: 1 }
        tracks: { type: array, description: An album's tracks when its library reports them (single-item reads only), items: { type: object, required: [id, title], properties: { id: { type: string, format: uuid, description: The track's Library item id; a report's part names it }, title: { type: string }, disc: { type: integer }, position: { type: integer } } } }
        issueKinds: { type: array, description: The kinds of Issue that can be reported about this item, items: { type: object, required: [kind, label], properties: { kind: { $ref: '#/components/schemas/IssueKind' }, label: { type: string } } } }
    LibraryConnectionSave:
      type: object
      additionalProperties: false
      description: At least one of url or credentials is required.
      properties:
        url: { type: string, maxLength: 2048, description: An http or https address with no username, query or fragment. Omit to keep the current address }
        username: { type: string, maxLength: 256, description: Only for Sources that sign in with a username (Navidrome) }
        credentials:
          type: object
          description: New credential values keyed by secret name (for example plex_token). Write-only; names left out keep their saved value.
          additionalProperties: { type: string, minLength: 1, maxLength: 4096 }
    LibraryConnection:
      type: object
      additionalProperties: false
      required: [slug, name, url, urlFromEnvironment, urlEnv, saved, takesUsername, username, active, missing, credentials]
      properties:
        slug: { type: string, enum: [jellyfin, plex, romm, navidrome, audiobookshelf] }
        name: { type: string }
        url: { type: string, description: The address in effect, empty when none }
        urlFromEnvironment: { type: boolean }
        urlEnv: { type: string, description: The environment variable that would set the address }
        saved: { type: boolean, description: A connection is saved here (it may be shadowed by the environment) }
        takesUsername: { type: boolean }
        username: { type: string }
        active: { type: boolean, description: The Source is scheduled to sync }
        missing: { type: array, items: { type: string }, description: What a half-set Source still needs }
        credentials:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [secret, label, configured, source, unreadable]
            properties:
              secret: { type: string, description: The stored-secret name, for PUT /admin/secrets/{name} }
              label: { type: string }
              configured: { type: boolean }
              source: { type: string, description: "none, stored, environment, shadowed or unreadable" }
              unreadable: { type: boolean }
    Selection:
      type: object
      additionalProperties: false
      description: >-
        The part of an item a Request covers (D027). Empty or omitted is the whole item. An album
        selects tracks; a series selects whole seasons and single episodes of seasons that are not
        selected whole. Selections merge by union into the one shared Request and never narrow it.
      properties:
        tracks:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [id, title]
            properties:
              id: { type: string, maxLength: 64 }
              position: { type: integer, minimum: 0, maximum: 10000 }
              title: { type: string, maxLength: 512 }
        seasons: { type: array, maxItems: 1000, items: { type: integer, minimum: 0, maximum: 999 } }
        episodes:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [season, episode]
            properties:
              season: { type: integer, minimum: 0, maximum: 999 }
              episode: { type: integer, minimum: 1, maximum: 100000 }
    TVDetails:
      type: object
      additionalProperties: false
      description: Whole-series TMDB details persisted in catalog JSON; counts never select seasons or episodes for a Request. Cast uses the same bounded optional enrichment budget as movies.
      properties:
        overview: { type: string, maxLength: 10000 }
        episodeRuntime: { type: integer, minimum: 1, maximum: 1440, description: "Per-episode minutes, not the total series length" }
        genres: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        firstAirDate: { type: string, format: date }
        lastAirDate: { type: string, format: date }
        seriesStatus: { type: string, enum: [Returning Series, Planned, In Production, Ended, Canceled, Pilot] }
        seasons: { type: integer, minimum: 1, maximum: 1000 }
        episodes: { type: integer, minimum: 1, maximum: 100000 }
        score: { type: number, minimum: 0, maximum: 10 }
        ratingCount: { type: integer, minimum: 1, maximum: 1000000000 }
        backdropUrl: { type: string, format: uri }
        creators: { type: array, maxItems: 10, items: { type: string, maxLength: 256 }, description: "Series creators from TMDB created_by, not episode directors" }
        cast:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 256 }
              character: { type: string, maxLength: 256 }
              profileUrl: { type: string, format: uri, description: Approved TMDB image origin only }
        seasonList:
          type: array
          maxItems: 50
          description: The series' seasons, for choosing seasons or episodes to request. Episodes are absent when TMDB's episode lists could not be read.
          items:
            type: object
            additionalProperties: false
            required: [number]
            properties:
              number: { type: integer, minimum: 0, maximum: 999, description: Season 0 is Specials }
              name: { type: string, maxLength: 256 }
              episodeCount: { type: integer, minimum: 1 }
              airDate: { type: string, format: date }
              episodes:
                type: array
                maxItems: 500
                items:
                  type: object
                  additionalProperties: false
                  required: [number]
                  properties:
                    number: { type: integer, minimum: 1 }
                    name: { type: string, maxLength: 256 }
                    airDate: { type: string, format: date }
        detailsUnavailable: { type: boolean }
    MoviePreviewState:
      type: object
      additionalProperties: false
      required: [availability, canRequest, canSubscribe, canExtend]
      properties:
        availability: { type: string, enum: [unknown, available, missing] }
        canRequest: { type: boolean, description: Role permits creation and no shared Request or known availability exists; writes remain authoritative }
        canSubscribe: { type: boolean, description: Shared Request is open and the current user is not subscribed }
        canExtend: { type: boolean, description: Role permits creation and the open shared Request covers only part of the item, so more of it can be added }
        request:
          type: object
          required: [id, status, subscribed]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [requested, approved, available, denied, cancelled] }
            subscribed: { type: boolean }
            selection: { $ref: '#/components/schemas/Selection' }
        libraries:
          type: array
          maxItems: 10
          description: The libraries holding the item, each named; a link is included only when it is usable and carries no credential.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              url: { type: string, format: uri, description: Present only when the library supplies a usable link without credentials }
    DevelopmentLogEntry:
      type: object
      additionalProperties: false
      required: [seq, time, target, stage, outcome, code, durationMs]
      properties:
        seq: { type: integer, minimum: 1, description: Process-local monotonically increasing sequence }
        time: { type: string, format: date-time, description: UTC completion time }
        target:
          type: string
          enum: [general, authentication, tmdb, musicbrainz, igdb, 'library:jellyfin', 'library:plex', 'library:romm', 'library:navidrome', 'library:audiobookshelf', notifications]
        stage: { type: string, enum: [check, request, oauth, platforms] }
        outcome: { type: string, enum: [success, failure, skipped] }
        code:
          type: string
          enum: [connected, connection_failed, authentication_failed, environment_required, incomplete_settings, disabled, http_status, network, network_timeout, network_dns, content_type, response_size, malformed_response]
          description: Safe classification only. The protected production dial path may collapse network failures to network.
        httpStatus: { type: integer, minimum: 100, maximum: 599, description: Present only when an HTTP response was received }
        durationMs: { type: integer, minimum: 0 }
    IgdbSettings:
      type: object
      required: [clientId, fromEnvironment]
      properties:
        clientId: { type: string }
        fromEnvironment: { type: boolean, description: "An environment value supplies the client ID and wins over a saved one" }
    SecretStatus:
      type: object
      required: [name, label, envVar, configured, source, unreadable, pendingRestart]
      properties:
        name: { type: string, enum: [tmdb_read_token, igdb_client_secret, apprise_config_key, navidrome_password, jellyfin_api_key, plex_token, romm_token, audiobookshelf_api_key] }
        label: { type: string }
        envVar: { type: string, description: "Environment variable that sets this secret; it always wins over a stored value" }
        configured: { type: boolean, description: "An effective value exists. False for an unreadable stored secret, which is not the same as unconfigured" }
        source: { type: string, enum: [none, environment, stored, "stored (shadowed by environment)", "stored secret unreadable"] }
        unreadable: { type: boolean, description: "A stored row exists but cannot be opened with the current master key" }
        pendingRestart: { type: boolean, description: "The value a restart would use differs from the one in effect now. Always false for credentials that apply at once unless the last apply failed" }
    MatchSuggestion:
      type: object
      required: [id, catalogItemId, catalogTitle, catalogYear, inventoryTitle, inventoryYear, mediaType, platformKey, sourceName, sourceItemId, confidence, reason, observedAt]
      properties:
        id: { type: string, format: uuid }
        catalogItemId: { type: string, format: uuid }
        catalogTitle: { type: string }
        catalogYear: { type: integer, description: Zero when unknown }
        inventoryTitle: { type: string }
        inventoryYear: { type: integer, description: Zero when unknown }
        mediaType: { type: string, enum: [movie, tv, album, song, game, audiobook] }
        platformKey: { type: string, description: Observed platform key; empty when not applicable or unknown }
        sourceName: { type: string }
        sourceItemId: { type: string }
        confidence: { type: string, enum: [title_year, title_only] }
        reason: { type: string }
        observedAt: { type: string, format: date-time }
    JobRun:
      type: object
      required: [id, sourceId, trigger, status, startedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        trigger: { type: string, enum: [schedule, manual] }
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        error: { type: string, description: Present on failed runs; fixed admin-safe text }
    Error:
      type: object
      description: >-
        The single error shape for every 4xx/5xx response under /api/v1, including
        unknown paths (404) and wrong methods (405). Responses also carry the
        X-Request-Id header, equal to error.requestId. Branch on code, never message.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, description: Stable machine-readable identifier, example: authentication_required }
            message: { type: string, description: Human-readable summary; not for programmatic use }
            requestId: { type: string, description: Same value as the X-Request-Id response header }
    ApprovalSettings:
      type: object
      additionalProperties: false
      required: [autoApproveTypes]
      properties:
        autoApproveTypes:
          type: array
          items: { type: string, enum: [movie, tv, album, song, game, audiobook] }
          description: Media types whose new Requests start approved; none by default
    PeopleSettings:
      type: object
      additionalProperties: false
      required: [defaultRole]
      properties:
        defaultRole: { type: string, enum: [viewer, requester], description: Role given to a person at their first sign-in; never admin }
    Notification:
      type: object
      additionalProperties: false
      required: [id, title, body, link, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'], description: An application path to open for this notice, such as /settings?tab=users }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
