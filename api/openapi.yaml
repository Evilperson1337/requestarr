openapi: 3.1.0
info:
  title: Requestarr API
  version: 0.0.0
  description: >-
    Every error response (4xx/5xx, including unknown paths and wrong methods) has the JSON body
    described by components/schemas/Error, and every response carries an X-Request-Id header
    (components/headers/RequestId). Per-operation error entries only list status meanings.
    Initial contract scaffold. Keep this synchronized with implemented handlers and
    generate clients/types only after endpoint semantics are reviewed.
servers:
  - url: /api/v1
paths:
  /auth/login:
    get:
      operationId: startOIDCLogin
      responses:
        '302': { description: Redirect to configured identity provider }
  /auth/callback:
    get:
      operationId: completeOIDCLogin
      responses:
        '303': { description: Set session and CSRF cookies, then redirect to canonical PublicURL }
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200': { description: Authenticated user and synchronizer CSRF token }
        '401': { description: Authentication required }
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session revoked }
        '403': { description: Origin or CSRF validation failed }
  /notifications:
    get:
      operationId: listNotifications
      summary: List the authenticated user's notification inbox
      responses:
        '200':
          description: Up to 100 newest user-scoped inbox entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401': { description: Authentication required }
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Notification marked read }
        '401': { description: Authentication required }
        '403': { description: Origin or CSRF validation failed }
        '404': { description: Notification not found for current user }
  /version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: Build information
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, date]
                properties:
                  version: { type: string }
                  commit: { type: string }
                  date: { type: string }
  /setup/status:
    get:
      operationId: getSetupStatus
      responses:
        '200':
          description: Minimal public first-run state; exposes no draft or identity information
          content:
            application/json:
              schema:
                type: object
                required: [complete, required]
                properties:
                  complete: { type: boolean, description: "First-admin bootstrap is complete" }
                  required: { type: boolean }
                  wizardComplete: { type: boolean, description: "An administrator finished the setup wizard (Finish); distinct from bootstrap completion" }
  /setup/claim-admin:
    post:
      operationId: claimInitialAdmin
      summary: Atomically consume the operator-issued initial-admin token
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [issuer, subject, token]
              properties:
                issuer: { type: string }
                subject: { type: string }
                token: { type: string }
      responses:
        '204': { description: Admin role granted and setup atomically completed }
        '401': { description: Authentication required }
        '403': { description: Generic claim failure }
  /catalog/{catalogID}/preview:
    get:
      operationId: moviePreviewState
      summary: Read local shared Request, subscription, and library availability state
      parameters:
        - { in: path, name: catalogID, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Local preview state and role-appropriate actions; no provider calls; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoviePreviewState' }
        '400': { description: Invalid catalog ID }
        '401': { description: Authentication required }
        '404': { description: Catalog item not found }
        '503': { description: Local preview state unavailable }
  /resolve:
    post:
      operationId: resolveUrl
      summary: Resolve a supported metadata URL without creating a request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
      responses:
        '200':
          description: Resolved canonical catalog item; movies and TV include typed details and local action state; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedPreview' }
        '400': { description: Unsupported URL, or the item was not found at the provider (metadata_resolution_failed) }
        '401': { description: Authentication required }
        '502': { description: The provider rejected Requestarr's credentials; an administrator must fix them (metadata_provider_credentials) }
        '503': { description: "The provider is busy (metadata_provider_busy, with Retry-After), its credentials are not set (metadata_provider_not_configured), or local preview state is unavailable; retry without discarding the pasted URL" }
  /requests:
    get:
      operationId: listRequests
      summary: Search, filter, sort, and page the shared request queue
      description: >-
        Available to every authenticated role. Filters combine with AND. Title search
        is a case-insensitive literal substring, not a wildcard pattern. My Requests
        means the current user's subscriptions, not just requests they created.
        The first page freezes matching IDs and order for 15 minutes (at most 10000
        IDs); later pages return current request details without reapplying filters.
        New requests and changes to title, status, or subscriptions do not move rows
        between pages. Restart without a cursor to refresh membership/order.
        Cursors are opaque, scoped to the user and normalized query including limit,
        and survive process restarts. Each user retains five active snapshots;
        starting a sixth expires the oldest. No upstream service calls are made.
      parameters:
        - in: query
          name: requestId
          schema: { type: string, format: uuid }
          description: Exact shared Request ID for View request navigation; combines with other filters and participates in cursor identity.
        - in: query
          name: q
          description: Title substring; trimmed; at most 200 Unicode characters
          schema: { type: string, maxLength: 200 }
        - in: query
          name: status
          schema: { type: string, enum: [requested, approved, available, denied, cancelled] }
        - in: query
          name: mediaType
          schema: { type: string, enum: [movie, tv, album, song, game] }
        - in: query
          name: mine
          schema: { type: boolean, default: false }
        - in: query
          name: sort
          description: >-
            Newest/oldest use request creation time; status uses requested, approved,
            available, denied, cancelled, then newest. Every order uses ID as a final
            ascending tie-breaker.
          schema: { type: string, enum: [newest, oldest, status], default: newest }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: cursor
          description: Opaque nextCursor from the previous page; repeat the same filters, sort, and limit
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Current request details in stable snapshot order; nextCursor is null on the final page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    description: Existing request objects, including availability, subscription state, and CatalogPlatforms
                    items: { type: object }
                  nextCursor: { type: [string, 'null'] }
        '400': { description: invalid_query for unknown, repeated, malformed, or out-of-range parameters; invalid_cursor for malformed, tampered, cross-user, or query-mismatched cursors }
        '401': { description: Authentication required }
        '410': { description: cursor_expired; snapshot expired, was evicted, or no longer exists; restart without cursor }
        '422': { description: query_too_large; more than 10000 matching requests; narrow the filters }
        '500': { description: requests_list_failed; safe generic error }
        '503': { description: requests_unavailable }
    post:
      operationId: createRequest
      summary: Create the one canonical shared request for an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platforms]
              properties:
                catalogId: { type: string, format: uuid }
                url: { type: string, format: uri, maxLength: 2048, description: Supported TMDB, MusicBrainz, or IGDB metadata URL. Mutually exclusive with catalogId. }
                note: { type: string, maxLength: 2000 }
                platforms:
                  type: object
                  required: [any]
                  properties:
                    any: { type: boolean }
                    platformKeys: { type: array, items: { type: string } }
                selection: { $ref: '#/components/schemas/Selection' }
      responses:
        '201': { description: Canonical request created with creator subscription and event }
        '200': { description: Existing shared request returned. When it was open and the selection added to it, Merged is true, the selection was widened (never narrowed) and the caller now follows it. }
        '400': { description: Invalid request }
        '403': { description: User role cannot create requests }
        '401': { description: Authentication required }
  /admin/sources/{source}/sync:
    post:
      operationId: syncSourceNow
      summary: Start a manual sync of a library Source (administrator only)
      description: >-
        Starts a sync in the background through the job runner and returns the new run.
        Manual and scheduled syncs share one no-overlap guard, so this returns 409 while a run
        is active instead of starting another. Follow progress with GET /admin/job-runs.
      parameters:
        - in: path
          name: source
          required: true
          description: Source slug, jellyfin, plex or romm (whichever are configured)
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Sync started
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: '#/components/schemas/JobRun' }
        '401': { description: Authentication required }
        '403': { description: Administrator role or CSRF validation failed }
        '404': { description: Source is not configured (code source_not_configured) }
        '409': { description: A sync for this source is already running (code sync_in_progress) }
        '503': { description: Sync unavailable }
  /admin/development-logs:
    get:
      operationId: getDevelopmentLogs
      summary: Recent connection-check diagnostics (development administrator only)
      description: >-
        Available only when REQUESTARR_DEV_LOGS is explicitly enabled and REQUESTARR_ENV is
        development; enabling it outside development is a startup configuration error. The route
        is not registered otherwise. Normal API authentication still applies to unknown routes.
        Returns a whole in-memory snapshot, oldest first, with at most 200 entries; refresh manually.
        Entries are lost on restart and seq is process-local. Only allowlisted connection-check
        facts are retained, never general logs, errors/messages, URLs, headers, query parameters,
        usernames, credentials, or provider bodies. A request-stage connected record means the HTTP
        and parse step succeeded; the final check record reports the target's validation outcome.
        IGDB uses separate oauth and platforms stages. No external calls are made to read this
        snapshot. All responses, including authorization errors and disabled-route misses, are no-store.
      responses:
        '200':
          description: Bounded recent snapshot
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entries, capacity]
                properties:
                  entries:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/DevelopmentLogEntry' }
                  capacity: { type: integer, const: 200 }
        '401': { description: Authentication required (including when disabled) }
        '403': { description: Administrator role required }
        '404': { description: Development logs disabled; authenticated request to absent route }
  /admin/status:
    get:
      operationId: getOperationalStatus
      summary: Provider and library Source status (administrator only)
      description: >-
        Local state only; never calls an external service. Every library Source kind is listed with
        whether it is configured, its latest run, last successful sync and last error (drawn from
        its 10 newest runs). Providers report configuration only. recentErrors lists up to 10 newest
        failed runs across Sources. Errors are fixed, admin-safe strings. Responses are no-store.
      responses:
        '200':
          description: Operational overview
          content:
            application/json:
              schema:
                type: object
                required: [providers, sources, recentErrors]
                properties:
                  developmentLogsEnabled:
                    type: boolean
                    const: true
                    description: Runtime capability for the development-logs endpoint; omitted when disabled. Administrator only.
                  providers:
                    type: array
                    items:
                      type: object
                      required: [key, name, configured]
                      properties:
                        key: { type: string }
                        name: { type: string }
                        configured: { type: boolean }
                        note: { type: string, description: "Fixed status text, for example 'stored secret unreadable' when a stored secret cannot be opened (D024); absent otherwise" }
                  sources:
                    type: array
                    items:
                      type: object
                      required: [slug, name, configured, lastRun, lastSuccessAt, lastSnapshotAt, lastError]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        configured: { type: boolean }
                        lastRun: { oneOf: [{ $ref: '#/components/schemas/JobRun' }, { type: 'null' }] }
                        lastSuccessAt: { type: [string, 'null'], format: date-time }
                        lastSnapshotAt: { type: [string, 'null'], format: date-time, description: When the Source last completed a full enumeration; a failed run never moves it }
                        lastError: { type: string }
                        note: { type: string, description: "Short fixed status such as 'stored secret unreadable'; absent when there is nothing to add" }
                  recentErrors:
                    type: array
                    items:
                      type: object
                      required: [source, run]
                      properties:
                        source: { type: string }
                        run: { $ref: '#/components/schemas/JobRun' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '500': { description: status_failed }
        '503': { description: status_unavailable }
  /admin/job-runs:
    get:
      operationId: listJobRuns
      summary: Recent background job runs per Source (administrator only)
      description: >-
        Lists up to 10 newest runs for every Source that has run a job. A Source never has two
        running runs; a run whose process crashed is failed with "abandoned: lease expired"
        once its lease lapses (lease times use the database clock). Each Source keeps its newest 200
        runs; older finished runs are pruned. Errors are fixed, admin-safe strings.
      responses:
        '200':
          description: Runs grouped by Source, newest first
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      required: [sourceId, name, runs]
                      properties:
                        sourceId: { type: string, format: uuid }
                        name: { type: string, description: Empty until the Source has been seen by a sync }
                        runs:
                          type: array
                          items: { $ref: '#/components/schemas/JobRun' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '503': { description: Job runs unavailable }
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users and their roles (administrator only)
      responses:
        '200': { description: Users with id, email, displayName, role (viewer, requester or admin) and createdAt }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
  /admin/users/{userId}/role:
    put:
      operationId: changeUserRole
      summary: Set a user's role; revokes the target's active sessions and records an audit event
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [viewer, requester, admin] }
      responses:
        '204': { description: Role changed, or already set }
        '400': { description: Invalid user ID or role }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: User not found }
        '409': { description: Cannot change your own role, or cannot demote the last administrator; nothing is changed }
  /admin/secrets:
    get:
      operationId: listStoredSecrets
      summary: Stored integration secrets, write-only status (administrator only)
      description: >-
        D024. Lists each registered secret with whether it is configured, where its effective
        value comes from, and whether a change waits for a restart. Values and ciphertext are
        never returned. enabled is false when REQUESTARR_SECRETS_KEY is not set, in which case
        the UI must refuse secret values. Responses are no-store.
      responses:
        '200':
          description: Secret status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, secrets]
                properties:
                  enabled: { type: boolean, description: "A valid master key is configured, so values can be saved" }
                  secrets:
                    type: array
                    items: { $ref: '#/components/schemas/SecretStatus' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '500': { description: "secret_status_failed" }
  /admin/secrets/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string, enum: [tmdb_read_token, igdb_client_secret, apprise_config_key, navidrome_password, jellyfin_api_key, plex_token, romm_token] }
    put:
      operationId: setStoredSecret
      summary: Save or replace a stored secret (administrator only)
      description: >-
        Encrypts the value with the master key (AES-256-GCM) and stores it with the key id.
        Available before and after setup Finish. The value is never returned, logged, audited or
        echoed in errors; a value-free audit event is written in the same transaction. The new
        value applies on the next restart; an environment value still wins. Requires CSRF and a
        same-origin Origin header. Body is capped at 8 KiB.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: "No surrounding whitespace or control characters" }
      responses:
        '204': { description: Secret saved }
        '400': { description: "invalid_secret_input; malformed, unknown-field or oversized body" }
        '401': { description: Authentication required }
        '403': { description: "Administrator role or CSRF/Origin failure" }
        '404': { description: "unknown_secret" }
        '409': { description: "secrets_disabled; REQUESTARR_SECRETS_KEY is not configured" }
        '422': { description: "invalid_secret_value" }
        '500': { description: "secret_update_failed; safe generic message" }
    delete:
      operationId: clearStoredSecret
      summary: Clear a stored secret (administrator only)
      description: >-
        Deletes the stored value (also when the master key is missing or wrong). Records a
        value-free audit event in the same transaction. Clearing an absent secret is a no-op.
        Requires CSRF and a same-origin Origin header.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Secret cleared }
        '401': { description: Authentication required }
        '403': { description: "Administrator role or CSRF/Origin failure" }
        '404': { description: "unknown_secret" }
        '500': { description: "secret_update_failed; safe generic message" }
  /admin/setup/source-kinds:
    get:
      operationId: listSourceKinds
      summary: List the Source kinds the setup wizard can configure (administrator only)
      description: >-
        The registry the wizard renders from: for each kind its slug, name, URL
        environment variable, default media types and ordered credential fields.
        A credential with a secret name is write-only and may be a stored secret.
      responses:
        '200':
          description: Source kinds in a stable order
          content:
            application/json:
              schema:
                type: object
                required: [kinds]
                properties:
                  kinds:
                    type: array
                    items:
                      type: object
                      required: [slug, name, urlEnv, mediaTypes, credentials]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        urlEnv: { type: string }
                        mediaTypes: { type: array, items: { type: string } }
                        credentials:
                          type: array
                          items:
                            type: object
                            required: [role, env]
                            properties:
                              role: { type: string, enum: [token, username, password] }
                              env: { type: string }
                              secret: { type: string, description: Stored secret name; absent for a plain field }
                              label: { type: string, description: Label for the secret field; absent for a plain field }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
  /admin/setup/draft:
    get:
      operationId: getSetupDraft
      summary: Load or initialize the shared inactive setup draft (administrator only)
      description: >-
        Resumes the saved step and revision across sessions. Loads local state only;
        performs no connection checks. Initial creation is idempotent and audited.
        Bootstrap authorization remains separate; this draft neither activates
        settings nor completes setup. Responses use Cache-Control no-store.
      responses:
        '200':
          description: Typed non-secret draft and computed environment/restart panel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupDraft' }
        '401': { description: "Authentication required" }
        '403': { description: "Administrator role required" }
        '500': { description: "Safe generic setup failure" }
        '503': { description: "Setup draft unavailable" }
    put:
      operationId: saveSetupDraft
      summary: Save non-secret draft settings and resume position (administrator only)
      description: >-
        Optimistic revision check; a successful save increments revision and clears
        previous connection results. Save is permitted despite failed connection
        checks. Unknown fields, including secret-valued fields, are rejected and
        never reflected. Only the listed fixed secret environment-variable names
        are accepted. Does not activate configuration or mark setup complete.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, currentStep, settings]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                currentStep: { type: string, enum: [general, authentication, providers, libraries, notifications, policy, review] }
                settings: { $ref: '#/components/schemas/SetupSettings' }
      responses:
        '200':
          description: Saved draft and updated environment panel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupDraft' }
        '400': { description: "invalid_setup_input; unknown fields, malformed JSON, or oversized body (32 KiB cap)" }
        '401': { description: "Authentication required" }
        '403': { description: "Administrator role or CSRF/Origin failure" }
        '409': { description: "setup_revision_conflict; reload saved draft before retrying" }
        '422': { description: "invalid_setup_settings; invalid non-secret fields, URLs, timezone, or secret-reference names" }
        '500': { description: "Safe generic setup failure" }
        '503': { description: "Setup draft unavailable" }
  /admin/setup/validate:
    post:
      operationId: validateSetupDraftConnection
      summary: Explicitly check one saved draft target (administrator only)
      description: >-
        Runs a context-cancellable connection probe outside database transactions,
        bounded to 10 seconds with a 1 MiB JSON response limit and no redirects.
        Checks only the saved revision and refuses to record a stale result after
        a concurrent save. Connection failures are safe persisted validation results,
        not destructive draft edits. Discovery does not prove interactive OIDC login.
        Results expire after ten minutes and never activate settings or finish setup.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, target]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                target: { type: string, enum: [general, authentication, tmdb, musicbrainz, igdb, library:jellyfin, library:plex, library:romm, library:navidrome, notifications] }
      responses:
        '200':
          description: Draft with a revision-bound safe validation result; valid may be false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupDraft' }
        '400': { description: "invalid_setup_input; malformed, unknown, or oversized input" }
        '401': { description: "Authentication required" }
        '403': { description: "Administrator role or CSRF/Origin failure" }
        '409': { description: "setup_revision_conflict; saved settings changed before/during the check" }
        '422': { description: "invalid_setup_settings; invalid revision or target" }
        '500': { description: "Safe generic setup failure" }
        '503': { description: "Setup draft unavailable" }
  /admin/setup/finish:
    post:
      operationId: finishSetup
      summary: Mark the setup wizard complete (administrator only)
      description: >-
        Succeeds only when every required check (General, Authentication, each
        enabled provider, library and Apprise) has a passing, unexpired result
        for the exact saved revision. Authentication stays OIDC-only; finishing
        adds no local-password path and does not hot-apply the draft. Repeating
        a finished request returns the completed draft. After completion, draft
        saves and checks return setup_already_complete.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Completed draft with completedAt set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupDraft' }
        '400': { description: "invalid_setup_input" }
        '401': { description: "Authentication required" }
        '403': { description: "Administrator role or CSRF/Origin failure" }
        '409': { description: "setup_revision_conflict; reload the saved draft" }
        '422': { description: "setup_not_ready; a required check is missing, failed or expired" }
        '500': { description: "Safe generic setup failure" }
        '503': { description: "Setup draft unavailable" }
  /admin/match-suggestions:
    get:
      operationId: listMatchSuggestions
      summary: List current title/year candidates for administrator review
      description: >-
        Returns up to 100 pending candidates, oldest first, from the latest successful
        complete source snapshots. Failed syncs preserve the last-known view.
        Suggestions never establish availability. Exact identifier matches take precedence.
      responses:
        '200':
          description: Pending candidates, including confidence and reason; an empty list is items=[]
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/MatchSuggestion' }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '500': { description: Could not load suggestions }
        '503': { description: Match review unavailable }
  /admin/match-suggestions/{suggestionId}/accept:
    post:
      operationId: acceptMatchSuggestion
      summary: Confirm a library match and reconcile availability (administrator only)
      description: >-
        Records the review actor, adds ordinary source/platform evidence, and invokes
        the normal availability/event/notification path in one transaction. Repeating
        an accepted decision succeeds without duplicate effects. A dismissed decision
        cannot be reversed. Stale candidates cannot be accepted. No request body.
      parameters:
        - in: path
          name: suggestionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Match accepted, or the same decision was already recorded }
        '400': { description: Invalid suggestion ID }
        '401': { description: Authentication required }
        '403': { description: Administrator role required, or CSRF/origin validation failed }
        '404': { description: Suggestion not found }
        '409': { description: Suggestion dismissed already, or no longer current; refresh after a successful sync }
        '500': { description: Review failed; transaction rolled back }
        '503': { description: Match review unavailable }
  /admin/match-suggestions/{suggestionId}/dismiss:
    post:
      operationId: dismissMatchSuggestion
      summary: Permanently dismiss a candidate without changing availability (administrator only)
      description: >-
        Records an auditable terminal decision for this catalog/library-item pair.
        Later syncs do not reopen it. Repeating the dismissal is a successful no-op.
        An accepted decision cannot be reversed. No request body.
      parameters:
        - in: path
          name: suggestionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Dismissed, or dismissal already recorded; availability unchanged }
        '400': { description: Invalid suggestion ID }
        '401': { description: Authentication required }
        '403': { description: Administrator role required, or CSRF/origin validation failed }
        '404': { description: Suggestion not found }
        '409': { description: Suggestion already accepted }
        '500': { description: Review failed; transaction rolled back }
        '503': { description: Match review unavailable }
  /requests/{requestId}/subscription:
    put:
      operationId: subscribeToRequest
      summary: Enable Notify Me for the current user
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Subscription enabled; changed=false when already enabled }
        '400': { description: Invalid request ID }
        '409': { description: Request is closed (denied, available or cancelled) and takes no new subscribers }
        '404': { description: Request not found }
        '401': { description: Authentication required }
    delete:
      operationId: unsubscribeFromRequest
      summary: Leave a request (D016); the last subscriber leaving cancels an open request
      description: >-
        Removes the current user's subscription. Any subscriber may leave, including the
        creator. The request stays open while other subscribers remain; when the last
        subscriber of a requested or approved request leaves, it becomes cancelled with a
        version bump and an audit event, but only with confirmCancel=true; without it the
        server returns 409 would_cancel and changes nothing. Idempotent by state, with no
        operation key: leaving again returns changed=false and writes no event.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: confirmCancel
          required: false
          description: Must be true for a leave that would cancel the request (the caller is the last subscriber)
          schema: { type: boolean, default: false }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Left (or was not subscribed)
          content:
            application/json:
              schema:
                type: object
                required: [subscribed, changed, cancelled]
                properties:
                  subscribed: { type: boolean, description: Always false after a leave }
                  changed: { type: boolean }
                  cancelled: { type: boolean, description: True when this leave cancelled the request }
        '400': { description: Invalid request ID }
        '401': { description: Authentication required }
        '409': { description: Leaving would cancel the request and confirmCancel was not set (code would_cancel) }
        '404': { description: Request not found }
  /requests/{requestId}/transition:
    post:
      operationId: transitionRequest
      summary: Admin-only approval or denial of a requested item, or outright cancellation of an open one; does not alter availability
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toStatus, expectedVersion, operationId]
              properties:
                toStatus: { type: string, enum: [approved, denied, cancelled], description: approved and denied apply to requested requests; cancelled applies to requested or approved requests }
                expectedVersion: { type: integer, minimum: 1 }
                operationId: { type: string, format: uuid }
      responses:
        '200': { description: Transition committed with incremented request version and audit event }
        '400': { description: Invalid transition payload or lifecycle transition not allowed from the current status }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '404': { description: Request not found }
        '409': { description: Stale request version }
components:
  headers:
    RequestId:
      description: >-
        Unique ID assigned to every response; also logged by the server as
        request_id. Client-supplied values are ignored. Quote it when reporting problems.
      schema: { type: string }
  schemas:
    ResolvedPreview:
      type: object
      required: [Item, Platforms]
      properties:
        Item:
          type: object
          description: Canonical catalog item; existing PascalCase fields are preserved.
          properties:
            ID: { type: string, format: uuid }
            MediaType: { type: string, enum: [movie, tv, album, song, game] }
            Title: { type: string }
            Year: { type: integer }
            Provider: { type: string }
            ProviderID: { type: string }
            ArtworkURL: { type: string }
            ArtworkKind: { type: string, enum: [poster, square] }
            ExternalURL: { type: string }
        Platforms: { type: array, items: { type: object } }
        Movie: { $ref: '#/components/schemas/MovieDetails' }
        TV: { $ref: '#/components/schemas/TVDetails' }
        Game: { $ref: '#/components/schemas/GameDetails' }
        Music: { $ref: '#/components/schemas/MusicDetails' }
        Preview: { $ref: '#/components/schemas/MoviePreviewState' }
    MusicDetails:
      type: object
      additionalProperties: false
      description: MusicBrainz details of an album or song, shown on the request preview. Every field is optional. Album art comes from the Cover Art Archive.
      properties:
        artists: { type: array, maxItems: 10, items: { type: string, maxLength: 256 } }
        primaryType: { type: string, maxLength: 40, description: "For an album, such as Album, EP or Single" }
        secondaryTypes: { type: array, maxItems: 5, items: { type: string, maxLength: 40 } }
        releaseDate: { type: string, format: date, description: Present only when MusicBrainz has a complete date }
        genres: { type: array, maxItems: 10, items: { type: string, maxLength: 80 } }
        lengthSeconds: { type: integer, minimum: 1, description: A song's duration }
        appearsOn: { type: array, maxItems: 5, items: { type: string, maxLength: 256 }, description: Releases a song appears on }
        score: { type: number, minimum: 0, maximum: 5, description: MusicBrainz community rating on a 0-5 scale }
        ratingCount: { type: integer, minimum: 1 }
    GameDetails:
      type: object
      additionalProperties: false
      description: IGDB details of a game, shown on the request preview. Every field is optional.
      properties:
        overview: { type: string, maxLength: 10000 }
        genres: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        releaseDate: { type: string, format: date }
        developers: { type: array, maxItems: 10, items: { type: string, maxLength: 256 } }
        score: { type: number, minimum: 0, maximum: 100, description: IGDB rating on a 0-100 scale }
        ratingCount: { type: integer, minimum: 1 }
        backdropUrl: { type: string, description: An IGDB screenshot }
    MovieDetails:
      type: object
      additionalProperties: false
      description: Movie-only validated metadata persisted in the existing catalog JSON; omitted facts are unknown. Credits have a 1.5-second sub-budget within a nine-second total lookup.
      properties:
        overview: { type: string, maxLength: 10000 }
        runtime: { type: integer, minimum: 1, maximum: 1440 }
        genres: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        releaseDate: { type: string, format: date }
        releaseStatus: { type: string, enum: [Rumored, Planned, In Production, Post Production, Released, Canceled] }
        score: { type: number, minimum: 0, maximum: 10, description: Present only with a positive ratingCount; not Requestarr votes }
        ratingCount: { type: integer, minimum: 1, maximum: 1000000000 }
        backdropUrl: { type: string, format: uri, description: Approved TMDB image origin only }
        directors: { type: array, maxItems: 10, items: { type: string, maxLength: 256 } }
        cast:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, maxLength: 256 }
              character: { type: string, maxLength: 256 }
              profileUrl: { type: string, format: uri, description: Approved TMDB image origin only }
        detailsUnavailable: { type: boolean, description: Secondary enrichment failed; ordinary absent credits are not a failure }
    Selection:
      type: object
      additionalProperties: false
      description: >-
        The part of an item a Request covers (D027). Empty or omitted is the whole item. An album
        selects tracks; a series selects whole seasons and single episodes of seasons that are not
        selected whole. Selections merge by union into the one shared Request and never narrow it.
      properties:
        tracks:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [id, title]
            properties:
              id: { type: string, maxLength: 64 }
              position: { type: integer, minimum: 0, maximum: 10000 }
              title: { type: string, maxLength: 512 }
        seasons: { type: array, maxItems: 1000, items: { type: integer, minimum: 0, maximum: 999 } }
        episodes:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [season, episode]
            properties:
              season: { type: integer, minimum: 0, maximum: 999 }
              episode: { type: integer, minimum: 1, maximum: 100000 }
    TVDetails:
      type: object
      additionalProperties: false
      description: Whole-series TMDB details persisted in catalog JSON; counts never select seasons or episodes for a Request. Cast uses the same bounded optional enrichment budget as movies.
      properties:
        overview: { type: string, maxLength: 10000 }
        episodeRuntime: { type: integer, minimum: 1, maximum: 1440, description: "Per-episode minutes, not the total series length" }
        genres: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        firstAirDate: { type: string, format: date }
        lastAirDate: { type: string, format: date }
        seriesStatus: { type: string, enum: [Returning Series, Planned, In Production, Ended, Canceled, Pilot] }
        seasons: { type: integer, minimum: 1, maximum: 1000 }
        episodes: { type: integer, minimum: 1, maximum: 100000 }
        score: { type: number, minimum: 0, maximum: 10 }
        ratingCount: { type: integer, minimum: 1, maximum: 1000000000 }
        backdropUrl: { type: string, format: uri }
        creators: { type: array, maxItems: 10, items: { type: string, maxLength: 256 }, description: "Series creators from TMDB created_by, not episode directors" }
        cast:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 256 }
              character: { type: string, maxLength: 256 }
              profileUrl: { type: string, format: uri, description: Approved TMDB image origin only }
        detailsUnavailable: { type: boolean }
    MoviePreviewState:
      type: object
      additionalProperties: false
      required: [availability, canRequest, canSubscribe]
      properties:
        availability: { type: string, enum: [unknown, available, missing] }
        canRequest: { type: boolean, description: Role permits creation and no shared Request or known availability exists; writes remain authoritative }
        canSubscribe: { type: boolean, description: Shared Request is open and the current user is not subscribed }
        request:
          type: object
          required: [id, status, subscribed]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [requested, approved, available, denied, cancelled] }
            subscribed: { type: boolean }
        libraries:
          type: array
          maxItems: 10
          description: Only available evidence with usable non-credential-bearing client links; never fabricated.
          items:
            type: object
            required: [name, url]
            properties:
              name: { type: string }
              url: { type: string, format: uri }
    DevelopmentLogEntry:
      type: object
      additionalProperties: false
      required: [seq, time, target, stage, outcome, code, durationMs]
      properties:
        seq: { type: integer, minimum: 1, description: Process-local monotonically increasing sequence }
        time: { type: string, format: date-time, description: UTC completion time }
        target:
          type: string
          enum: [general, authentication, tmdb, musicbrainz, igdb, 'library:jellyfin', 'library:plex', 'library:romm', 'library:navidrome', notifications]
        stage: { type: string, enum: [check, request, oauth, platforms] }
        outcome: { type: string, enum: [success, failure, skipped] }
        code:
          type: string
          enum: [connected, connection_failed, authentication_failed, environment_required, incomplete_settings, disabled, http_status, network, network_timeout, network_dns, content_type, response_size, malformed_response]
          description: Safe classification only. The protected production dial path may collapse network failures to network.
        httpStatus: { type: integer, minimum: 100, maximum: 599, description: Present only when an HTTP response was received }
        durationMs: { type: integer, minimum: 0 }
    SetupSettings:
      type: object
      additionalProperties: false
      required: [general, authentication, providers, libraries, notifications, policy]
      properties:
        general:
          type: object
          additionalProperties: false
          required: [instanceName, timezone, publicUrl]
          properties:
            instanceName: { type: string, maxLength: 120 }
            timezone: { type: string, maxLength: 128, description: "Empty while drafting or a valid IANA timezone" }
            publicUrl: { type: string, maxLength: 2048, description: "Empty while drafting or HTTPS URL without credentials/query/fragment; HTTP allowed only in development" }
        authentication:
          type: object
          additionalProperties: false
          required: [issuer, clientId, clientSecretEnv]
          properties:
            issuer: { type: string, maxLength: 2048, description: "OIDC discovery issuer; same URL safety rules as publicUrl" }
            clientId: { type: string, maxLength: 256 }
            clientSecretEnv: { type: string, enum: [REQUESTARR_OIDC_CLIENT_SECRET] }
        providers:
          type: object
          additionalProperties: false
          required: [tmdbEnabled, tmdbTokenEnv, musicBrainzEnabled, musicBrainzContact, igdbEnabled, igdbClientId, igdbClientSecretEnv]
          properties:
            tmdbEnabled: { type: boolean }
            tmdbTokenEnv: { type: string, enum: [REQUESTARR_TMDB_READ_TOKEN] }
            musicBrainzEnabled: { type: boolean }
            musicBrainzContact: { type: string, maxLength: 254, description: "Empty while drafting or a contact email for the explicit check user-agent" }
            igdbEnabled: { type: boolean }
            igdbClientId: { type: string, maxLength: 256 }
            igdbClientSecretEnv: { type: string, enum: [REQUESTARR_IGDB_CLIENT_SECRET] }
        libraries:
          type: object
          additionalProperties: false
          required: [jellyfin, plex, romm, navidrome]
          properties:
            jellyfin: { $ref: '#/components/schemas/SetupSource' }
            plex: { $ref: '#/components/schemas/SetupSource' }
            romm: { $ref: '#/components/schemas/SetupSource' }
            navidrome: { $ref: '#/components/schemas/SetupSource' }
        notifications:
          type: object
          additionalProperties: false
          required: [appriseEnabled, appriseUrl, appriseConfigKeyEnv]
          properties:
            appriseEnabled: { type: boolean }
            appriseUrl: { type: string, maxLength: 2048, description: "Empty while drafting or an Apprise API URL; must equal REQUESTARR_APPRISE_URL for the check to pass" }
            appriseConfigKeyEnv: { type: string, enum: [REQUESTARR_APPRISE_CONFIG_KEY] }
        policy:
          type: object
          additionalProperties: false
          required: [autoApproveMediaTypes]
          properties:
            autoApproveMediaTypes: { type: array, uniqueItems: true, items: { type: string, enum: [movie, tv, album, song, game] }, description: "Media types that skip administrator approval; empty means all requests await approval" }
    SecretStatus:
      type: object
      required: [name, label, envVar, configured, source, unreadable, pendingRestart]
      properties:
        name: { type: string, enum: [tmdb_read_token, igdb_client_secret, apprise_config_key, navidrome_password, jellyfin_api_key, plex_token, romm_token] }
        label: { type: string }
        envVar: { type: string, description: "Environment variable that sets this secret; it always wins over a stored value" }
        configured: { type: boolean, description: "An effective value exists. False for an unreadable stored secret, which is not the same as unconfigured" }
        source: { type: string, enum: [none, environment, stored, "stored (shadowed by environment)", "stored secret unreadable"] }
        unreadable: { type: boolean, description: "A stored row exists but cannot be opened with the current master key" }
        pendingRestart: { type: boolean, description: "The value a restart would use differs from the one in effect now" }
    SetupSource:
      type: object
      additionalProperties: false
      required: [enabled, url, mediaTypes, tokenEnv, username, passwordEnv]
      properties:
        enabled: { type: boolean }
        url: { type: string, maxLength: 2048, description: "Empty while drafting or an absolute origin" }
        mediaTypes: { type: array, uniqueItems: true, items: { type: string, enum: [movie, tv, album, song, game] } }
        tokenEnv: { type: string, enum: ["", REQUESTARR_JELLYFIN_API_KEY, REQUESTARR_PLEX_TOKEN, REQUESTARR_ROMM_TOKEN] }
        username: { type: string, maxLength: 256, description: "Navidrome account name, an ordinary non-secret draft field; must be empty for other Sources. Drafts saved with the retired usernameEnv still load, and an empty value takes the environment-configured username" }
        passwordEnv: { type: string, enum: ["", REQUESTARR_NAVIDROME_PASSWORD] }
    SetupDraft:
      type: object
      required: [revision, currentStep, settings, validations, updatedAt, inactive, environment, blockers, completedAt]
      properties:
        revision: { type: integer, minimum: 1 }
        currentStep: { type: string, enum: [general, authentication, providers, libraries, notifications, policy, review] }
        settings: { $ref: '#/components/schemas/SetupSettings' }
        updatedAt: { type: string, format: date-time }
        inactive: { type: boolean, const: true }
        completedAt: { type: [string, 'null'], format: date-time, description: "Set once an administrator finished setup" }
        blockers:
          type: array
          description: Required checks that are missing, failed or expired for this revision; Finish needs this empty
          items:
            type: object
            required: [target, reason]
            properties:
              target: { type: string, enum: [general, authentication, tmdb, musicbrainz, igdb, library:jellyfin, library:plex, library:romm, library:navidrome, notifications] }
              reason: { type: string, enum: [not_checked, failed, expired] }
        validations:
          type: array
          items:
            type: object
            required: [target, revision, valid, code, message, checkedAt, expiresAt]
            properties:
              target: { type: string, enum: [general, authentication, tmdb, musicbrainz, igdb, library:jellyfin, library:plex, library:romm, library:navidrome, notifications] }
              revision: { type: integer }
              valid: { type: boolean }
              code: { type: string, enum: [connected, connection_failed, authentication_failed, environment_required, incomplete_settings, disabled] }
              message: { type: string, description: "Fixed safe result; never raw upstream errors or payloads. A TMDB check names the secret source it used (D024) and runs against the value the next restart would use" }
              checkedAt: { type: string, format: date-time }
              expiresAt: { type: string, format: date-time }
        environment:
          type: array
          items:
            type: object
            required: [name, secret, configured, needsRestart]
            properties:
              name: { type: string }
              secret: { type: boolean }
              configured: { type: boolean, description: "Presence only, not proof credentials work" }
              needsRestart: { type: boolean }
              desiredValue: { type: string, description: "Non-secret values only; absent for every secret reference" }
    MatchSuggestion:
      type: object
      required: [id, catalogItemId, catalogTitle, catalogYear, inventoryTitle, inventoryYear, mediaType, platformKey, sourceName, sourceItemId, confidence, reason, observedAt]
      properties:
        id: { type: string, format: uuid }
        catalogItemId: { type: string, format: uuid }
        catalogTitle: { type: string }
        catalogYear: { type: integer, description: Zero when unknown }
        inventoryTitle: { type: string }
        inventoryYear: { type: integer, description: Zero when unknown }
        mediaType: { type: string, enum: [movie, tv, album, song, game] }
        platformKey: { type: string, description: Observed platform key; empty when not applicable or unknown }
        sourceName: { type: string }
        sourceItemId: { type: string }
        confidence: { type: string, enum: [title_year, title_only] }
        reason: { type: string }
        observedAt: { type: string, format: date-time }
    JobRun:
      type: object
      required: [id, sourceId, trigger, status, startedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        trigger: { type: string, enum: [schedule, manual] }
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        error: { type: string, description: Present on failed runs; fixed admin-safe text }
    Error:
      type: object
      description: >-
        The single error shape for every 4xx/5xx response under /api/v1, including
        unknown paths (404) and wrong methods (405). Responses also carry the
        X-Request-Id header, equal to error.requestId. Branch on code, never message.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, description: Stable machine-readable identifier, example: authentication_required }
            message: { type: string, description: Human-readable summary; not for programmatic use }
            requestId: { type: string, description: Same value as the X-Request-Id response header }
    Notification:
      type: object
      additionalProperties: false
      required: [id, title, body, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
