openapi: 3.1.0
info:
  title: Requestarr API
  version: 0.0.0
  description: >-
    Initial contract scaffold. Keep this synchronized with implemented handlers and
    generate clients/types only after endpoint semantics are reviewed.
servers:
  - url: /api/v1
paths:
  /healthz:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: getLiveness
      summary: Dependency-free process liveness
      servers: [{ url: / }]
      responses:
        '200':
          description: Process is serving HTTP
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /readyz:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: getReadiness
      summary: Migration-complete PostgreSQL readiness
      servers: [{ url: / }]
      responses:
        '200':
          description: Application and PostgreSQL are ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: PostgreSQL is unavailable or initialization is incomplete
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReady'
  /version:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: getVersion
      responses:
        '200':
          description: Build information
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, date]
                properties:
                  version: { type: string }
                  commit: { type: string }
                  date: { type: string }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: headVersion
      responses:
        '200':
          description: Build information headers without a response body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /setup/status:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: getSetupStatus
      summary: Read the persistent setup completion gate
      description: >-
        Public completion-only signal used to choose setup or normal login. It
        requires neither OIDC authentication nor a setup token and discloses no
        current step, draft, configuration, or validation state.
      responses:
        '200':
          description: Persisted setup completion state; complete may be false or true
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/SetupStatusUnavailable'
    head:
      operationId: headSetupStatus
      responses:
        '200':
          description: First-run setup state headers without a response body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/SetupStatusUnavailableHead'
  /setup/session:
    parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/SetupOrigin'
    post:
      operationId: createSetupSession
      summary: Exchange the temporary deployment token for a setup session
      description: >-
        Pre-OIDC bootstrap exchange. The token is accepted only in this bounded
        JSON body. The configured public origin must match exactly. Success
        returns only an environment-selected,
        15-minute HttpOnly SameSite=Strict cookie and no response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupSessionRequest'
      responses:
        '204':
          description: A new independent setup session was issued.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: >-
                Production uses __Host-requestarr_setup with Secure; explicit
                loopback HTTP development uses requestarr_setup_dev without Secure.
                Both are HttpOnly, SameSite=Strict, Path=/, Max-Age=900, and omit Domain.
              required: true
              schema: { type: string }
        '400':
          $ref: '#/components/responses/SetupInvalidRequest'
        '401':
          $ref: '#/components/responses/SetupTokenInvalid'
        '403':
          $ref: '#/components/responses/SetupForbidden'
        '409':
          $ref: '#/components/responses/SetupCompleted'
        '423':
          $ref: '#/components/responses/SetupLocked'
        '429':
          $ref: '#/components/responses/SetupRateLimited'
        '503':
          $ref: '#/components/responses/SetupUnavailable'
    get:
      operationId: rejectGetSetupSession
      responses:
        '405': { $ref: '#/components/responses/SetupSessionMethodNotAllowed' }
    head:
      operationId: rejectHeadSetupSession
      responses:
        '405': { $ref: '#/components/responses/SetupSessionMethodNotAllowed' }
    put:
      operationId: rejectPutSetupSession
      responses:
        '405': { $ref: '#/components/responses/SetupSessionMethodNotAllowed' }
    patch:
      operationId: rejectPatchSetupSession
      responses:
        '405': { $ref: '#/components/responses/SetupSessionMethodNotAllowed' }
    delete:
      operationId: rejectDeleteSetupSession
      responses:
        '405': { $ref: '#/components/responses/SetupSessionMethodNotAllowed' }
    options:
      operationId: rejectOptionsSetupSession
      responses:
        '405': { $ref: '#/components/responses/SetupSessionMethodNotAllowed' }
  /setup/state:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: getSetupWorkflowState
      summary: Read resumable non-secret setup workflow state
      description: Requires the environment-selected setup session cookie. Origin and CSRF headers are not required for this read.
      responses:
        '200':
          description: Current step, optional typed non-secret drafts, and secret presence only
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupWorkflowState' }
        '401': { $ref: '#/components/responses/SetupSessionRequired' }
        '409': { $ref: '#/components/responses/SetupCompleted' }
        '503': { $ref: '#/components/responses/SetupUnavailable' }
    head:
      operationId: headSetupWorkflowState
      description: Identical status and headers to GET, with no response body as required by HTTP HEAD semantics.
      responses:
        '200': { $ref: '#/components/responses/SetupWorkflowStateHead' }
        '401': { $ref: '#/components/responses/SetupSessionRequiredHead' }
        '409': { $ref: '#/components/responses/SetupCompletedHead' }
        '503': { $ref: '#/components/responses/SetupUnavailableHead' }
    post: { operationId: rejectPostSetupWorkflowState, responses: { '405': { $ref: '#/components/responses/SetupStateMethodNotAllowed' } } }
    put: { operationId: rejectPutSetupWorkflowState, responses: { '405': { $ref: '#/components/responses/SetupStateMethodNotAllowed' } } }
    patch: { operationId: rejectPatchSetupWorkflowState, responses: { '405': { $ref: '#/components/responses/SetupStateMethodNotAllowed' } } }
    delete: { operationId: rejectDeleteSetupWorkflowState, responses: { '405': { $ref: '#/components/responses/SetupStateMethodNotAllowed' } } }
    options: { operationId: rejectOptionsSetupWorkflowState, responses: { '405': { $ref: '#/components/responses/SetupStateMethodNotAllowed' } } }
  /setup/general:
    parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/SetupOrigin'
      - in: header
        name: X-Requestarr-CSRF
        required: true
        schema: { type: string, const: '1' }
    put:
      operationId: putSetupGeneral
      summary: Idempotently save the General setup step
      description: >-
        Processing precedence is method, Origin, CSRF, exact content type and
        strict bounded JSON, typed validation, then setup-session authorization
        and persistence under the setup-state lock. Requires exactly one
        environment-selected canonical session cookie, exactly one normalized
        configured Origin, and exactly X-Requestarr-CSRF: 1. No CORS or
        preflight support is provided. An identical normalized no-op save does
        not emit another audit event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupGeneral' }
      responses:
        '200':
          description: Saved normalized draft and monotonically advanced workflow state
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupWorkflowState' }
        '400': { $ref: '#/components/responses/SetupInvalidRequest' }
        '401': { $ref: '#/components/responses/SetupSessionRequired' }
        '403':
          description: Origin validation or the setup CSRF check failed.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SetupOriginForbiddenError'
                  - $ref: '#/components/schemas/SetupCSRFForbiddenError'
        '409': { $ref: '#/components/responses/SetupCompleted' }
        '422': { $ref: '#/components/responses/SetupGeneralInvalid' }
        '503': { $ref: '#/components/responses/SetupUnavailable' }
    get: { operationId: rejectGetSetupGeneral, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
    head: { operationId: rejectHeadSetupGeneral, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowedHead' } } }
    post: { operationId: rejectPostSetupGeneral, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
    patch: { operationId: rejectPatchSetupGeneral, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
    delete: { operationId: rejectDeleteSetupGeneral, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
    options: { operationId: rejectOptionsSetupGeneral, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
  /setup/authentication:
    parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/SetupOrigin'
      - in: header
        name: X-Requestarr-CSRF
        required: true
        schema: { type: string, const: '1' }
    put:
      operationId: putSetupAuthentication
      summary: Save the encrypted Authentication setup draft
      description: Locally validates and normalizes OIDC values without discovery or another network call. The client secret uses explicit preserve, replace, or clear semantics and is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupAuthenticationRequest' }
      responses:
        '200':
          description: Saved normalized non-secret draft and secret-presence state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupWorkflowState' }
        '400': { $ref: '#/components/responses/SetupInvalidRequest' }
        '401': { $ref: '#/components/responses/SetupSessionRequired' }
        '403':
          description: Origin validation or the setup CSRF check failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SetupOriginForbiddenError'
                  - $ref: '#/components/schemas/SetupCSRFForbiddenError'
        '409': { $ref: '#/components/responses/SetupCompleted' }
        '422': { $ref: '#/components/responses/SetupAuthenticationInvalid' }
        '423': { $ref: '#/components/responses/SetupLocked' }
        '503': { $ref: '#/components/responses/SetupUnavailable' }
    get: { operationId: rejectGetSetupAuthentication, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
    head: { operationId: rejectHeadSetupAuthentication, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowedHead' } } }
    post: { operationId: rejectPostSetupAuthentication, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
    patch: { operationId: rejectPatchSetupAuthentication, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
    delete: { operationId: rejectDeleteSetupAuthentication, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
    options: { operationId: rejectOptionsSetupAuthentication, responses: { '405': { $ref: '#/components/responses/SetupGeneralMethodNotAllowed' } } }
components:
  parameters:
    RequestID:
      in: header
      name: X-Request-ID
      required: false
      description: >-
        Optional caller correlation ID. Values must contain 1-64 ASCII letters,
        digits, period, underscore, or hyphen. Invalid values are replaced.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
    SetupOrigin:
      in: header
      name: Origin
      required: true
      description: Exactly one origin matching the normalized configured public URL.
      schema: { type: string }
  headers:
    RequestID:
      description: The accepted or server-generated request correlation ID.
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
    AllowGet:
      description: Methods supported by this resource.
      required: true
      schema:
        type: array
        items:
          type: string
          enum: [GET, HEAD]
        minItems: 2
        maxItems: 2
        uniqueItems: true
      style: simple
      explode: true
    NoStore:
      description: Prevents storage of the public setup-routing signal or its errors.
      required: true
      schema:
        type: string
        const: no-store
    AllowPost:
      description: The sole method supported by setup-session exchange.
      required: true
      schema: { type: string, const: POST }
    AllowPut:
      description: The sole method supported by General setup mutation.
      required: true
      schema: { type: string, const: PUT }
    RetryAfter:
      description: Whole seconds until the next fixed rate-limit window, clamped to 1-900.
      required: true
      schema: { type: integer, minimum: 1, maximum: 900 }
  responses:
    MethodNotAllowed:
      description: The resource exists but does not support the requested method.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Allow:
          $ref: '#/components/headers/AllowGet'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorEnvelope'
    SetupStatusUnavailable:
      description: Persisted setup state is unavailable or invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupStatusUnavailableError'
    SetupStatusUnavailableHead:
      description: Persisted setup state is unavailable or invalid; no response body is sent.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
    SetupSessionMethodNotAllowed:
      description: Only POST is supported by this resource.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Allow: { $ref: '#/components/headers/AllowPost' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIErrorEnvelope' }
    SetupInvalidRequest:
      description: The content type, bounded JSON document, or token encoding is invalid.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupInvalidRequestError' }
    SetupTokenInvalid:
      description: The accepted-format candidate does not verify.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupTokenInvalidError' }
    SetupForbidden:
      description: Origin validation failed.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupOriginForbiddenError'
    SetupCompleted:
      description: Authoritative setup state is already complete.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupCompletedError' }
    SetupLocked:
      description: The incomplete instance has no valid deployment token configured.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupLockedError' }
    SetupRateLimited:
      description: The direct-peer or global fixed-window limit is exhausted.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupRateLimitedError' }
    SetupUnavailable:
      description: Required persistence or cryptographic randomness is unavailable.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupUnavailableError' }
    SetupSessionRequired:
      description: >-
        The selected setup session cookie is missing, duplicated, malformed,
        unknown, expired, revoked, invalidated by key rotation, or supplied
        simultaneously with the other environment's cookie name. Production
        selects __Host-requestarr_setup (Secure, HttpOnly, SameSite=Strict,
        Path=/, no Domain); explicit loopback HTTP development selects
        requestarr_setup_dev without Secure. Values are canonical unpadded
        base64url encodings of exactly 32 bytes and sessions have an absolute
        15-minute lifetime evaluated against PostgreSQL time after a mutation
        acquires the setup-state lock.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIErrorEnvelope' }
    SetupGeneralInvalid:
      description: General values failed typed validation.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupGeneralInvalidError' }
    SetupAuthenticationInvalid:
      description: Authentication values or client-type/secret operation semantics failed validation.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupAuthenticationInvalidError' }
    SetupStateMethodNotAllowed:
      description: Only GET and HEAD are supported by this resource.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Allow: { $ref: '#/components/headers/AllowGet' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIErrorEnvelope' }
    SetupGeneralMethodNotAllowed:
      description: Only PUT is supported by this resource; OPTIONS is rejected and no CORS preflight is available.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Allow: { $ref: '#/components/headers/AllowPut' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIErrorEnvelope' }
    SetupGeneralMethodNotAllowedHead:
      description: Only PUT is supported; HTTP HEAD suppresses the error body.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Allow: { $ref: '#/components/headers/AllowPut' }
    SetupWorkflowStateHead:
      description: Workflow state headers; HTTP HEAD suppresses the GET representation body.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
    SetupSessionRequiredHead:
      description: A valid setup session is required; HTTP HEAD suppresses the error body.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
    SetupCompletedHead:
      description: Setup is complete; HTTP HEAD suppresses the error body.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
    SetupUnavailableHead:
      description: Setup persistence is unavailable; HTTP HEAD suppresses the error body.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
  schemas:
    APIErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [not_found, method_not_allowed, setup_status_unavailable, invalid_request, setup_session_required, setup_general_invalid, setup_origin_forbidden, setup_csrf_forbidden, setup_token_invalid, setup_locked, setup_completed, setup_rate_limited, setup_unavailable]
            message: { type: string }
            request_id: { type: string }
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ready }
    NotReady:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, const: not_ready }
        reason: { type: string, const: database_unavailable }
    SetupStatus:
      type: object
      additionalProperties: false
      required: [complete]
      properties:
        complete:
          type: boolean
          description: False while setup is incomplete and true after completion.
      examples:
        - complete: false
        - complete: true
    SetupStatusUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string, const: setup_status_unavailable }
            message: { type: string, const: Setup status is temporarily unavailable. }
            request_id: { type: string }
      examples:
        - error:
            code: setup_status_unavailable
            message: Setup status is temporarily unavailable.
            request_id: 0123456789abcdef0123456789abcdef
    SetupSessionRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Canonical unpadded base64url encoding of exactly 32 bytes.
    SetupGeneral:
      type: object
      additionalProperties: false
      required: [instance_name, public_url, timezone]
      properties:
        instance_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed, valid UTF-8; 1-100 Unicode code points and at most 400 UTF-8 bytes.
        public_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https?://[^/?#]+/?$'
          description: >-
            Trimmed absolute HTTP(S) origin with a non-empty host, no userinfo,
            path (except an optional slash), query, fragment, or opaque form;
            scheme and host are lowercased and a trailing slash is removed.
            Limited to 2048 Unicode code points and 8192 UTF-8 bytes.
        timezone:
          type: string
          minLength: 1
          maxLength: 128
          description: Trimmed valid IANA timezone name other than Local; at most 128 Unicode code points and 512 UTF-8 bytes.
    SetupAuthentication:
      type: object
      additionalProperties: false
      required: [issuer, client_id, client_type, scopes, groups_claim, default_role, group_role_mappings]
      properties:
        issuer: { type: string, format: uri, maxLength: 2048 }
        client_id: { type: string, maxLength: 256 }
        client_type: { type: string, enum: [public, confidential] }
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { type: string, maxLength: 64 }
        groups_claim: { type: string, maxLength: 128 }
        default_role: { type: string, enum: [viewer, requester, admin] }
        group_role_mappings:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [group, role]
            properties:
              group: { type: string, maxLength: 256 }
              role: { type: string, enum: [viewer, requester, admin] }
    SetupAuthenticationRequest:
      type: object
      additionalProperties: false
      required: [issuer, client_id, client_type, scopes, groups_claim, default_role, group_role_mappings, client_secret_operation]
      properties:
        issuer: { type: string, format: uri, maxLength: 2048 }
        client_id: { type: string, maxLength: 256 }
        client_type: { type: string, enum: [public, confidential] }
        scopes: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, maxLength: 64 } }
        groups_claim: { type: string, maxLength: 128 }
        default_role: { type: string, enum: [viewer, requester, admin] }
        group_role_mappings:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [group, role]
            properties:
              group: { type: string, maxLength: 256 }
              role: { type: string, enum: [viewer, requester, admin] }
        client_secret_operation: { type: string, enum: [preserve, replace, clear] }
        client_secret: { type: string, minLength: 1, maxLength: 8192, writeOnly: true }
      examples:
        - { issuer: "https://id.example.com/realms/main", client_id: requestarr, client_type: confidential, scopes: [openid, profile], groups_claim: groups, default_role: viewer, group_role_mappings: [], client_secret_operation: replace, client_secret: deployment-secret }
        - { issuer: "https://id.example.com/realms/main", client_id: requestarr, client_type: confidential, scopes: [openid], groups_claim: groups, default_role: viewer, group_role_mappings: [], client_secret_operation: preserve }
        - { issuer: "https://id.example.com/realms/main", client_id: requestarr, client_type: public, scopes: [openid], groups_claim: groups, default_role: viewer, group_role_mappings: [], client_secret_operation: clear }
    SetupWorkflowState:
      type: object
      additionalProperties: false
      required: [current_step]
      properties:
        current_step:
          type: string
          enum: [welcome, general, authentication, providers, libraries, notifications, policy, review, finish]
        general: { $ref: '#/components/schemas/SetupGeneral' }
        authentication: { $ref: '#/components/schemas/SetupAuthentication' }
        client_secret_configured: { type: boolean, description: Presence only; the stored secret is never returned. }
