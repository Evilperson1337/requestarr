version: 2

project_name: requestarr

before:
  hooks:
    - go mod tidy
    # The binary embeds the UI (internal/webui), which is not committed: build it first.
    - npm --prefix web ci --no-audit --no-fund
    - make web-build
    - go test ./...

builds:
  - id: requestarr
    main: ./cmd/requestarr
    binary: requestarr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{.Version}}
        -X main.commit={{.Commit}}
        -X main.date={{.Date}}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE.md
      - README.md
      - config/requestarr.example.yaml

# SPDX SBOM per archive (Syft must be on PATH; the release workflow installs it).
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  draft: true
  prerelease: auto
