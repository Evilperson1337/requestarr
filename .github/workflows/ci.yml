name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: gofmt -w $(find cmd internal -name '*.go' -type f) && git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/requestarr
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck/build
        working-directory: web
        run: npm run build
