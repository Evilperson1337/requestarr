name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: requestarr
          POSTGRES_USER: requestarr
          POSTGRES_PASSWORD: requestarr
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U requestarr -d requestarr"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build embedded UI
        run: npm --prefix web ci --no-audit --no-fund && make web-build
      - run: gofmt -w $(find cmd internal db -name '*.go' -type f) && git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/requestarr
      - name: PostgreSQL integration tests
        env:
          REQUESTARR_TEST_DATABASE_URL: postgres://requestarr:requestarr@localhost:5432/requestarr?sslmode=disable
        run: go test -tags=integration ./internal/store/postgres/...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Node versions match the Dockerfile
        run: scripts/check-node-version.sh
      - name: Deployment files (compose and example environment)
        run: scripts/deploy-files-test.sh
      - name: Release configuration matches D023
        run: scripts/check-release-config.sh
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck (app and tests)
        working-directory: web
        run: npm run check
      - name: Typecheck/build
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: web
        run: npm test
