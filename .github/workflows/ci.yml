name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: requestarr_ci
          POSTGRES_USER: requestarr_ci
          POSTGRES_PASSWORD: requestarr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U requestarr_ci -d requestarr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: gofmt -w $(find cmd internal -name '*.go' -type f) && git diff --exit-code
      - run: go test ./...
      - name: Test PostgreSQL integration with race detector
        env:
          REQUESTARR_TEST_DATABASE_URL: postgres://requestarr_ci:requestarr_ci@localhost:5432/requestarr_ci?sslmode=disable
        run: go test -race -tags=integration ./internal/app ./internal/store/...
      - run: go vet ./...
      - run: go build ./cmd/requestarr
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck/build
        working-directory: web
        run: npm run build
