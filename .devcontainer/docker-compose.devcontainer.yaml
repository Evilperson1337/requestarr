services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspaces/requestarr:cached
    command: sleep infinity
    environment:
      REQUESTARR_DATABASE_URL: postgres://requestarr:requestarr@postgres:5432/requestarr?sslmode=disable
      REQUESTARR_HTTP_ADDR: :8080
      REQUESTARR_PUBLIC_URL: http://localhost:5173
      REQUESTARR_OIDC_ISSUER: http://keycloak:8080/realms/requestarr
      REQUESTARR_OIDC_CLIENT_ID: requestarr
      REQUESTARR_OIDC_CLIENT_SECRET: requestarr-dev-secret
      APPRISE_API_URL: http://apprise:8000
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      apprise:
        condition: service_started
